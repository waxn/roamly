name: Android compile check

# Compile-only, for branches pushed purely to check a change builds before it
# is tagged as a release. Kotlin errors are re-emitted as workflow annotations,
# which (unlike job logs) can be read without auth on a public repo.
on:
  push:
    branches:
      - 'mobile-ci/**'
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Compile
        run: |
          set -o pipefail
          status=0
          ./gradlew compileDebugKotlin --console=plain 2>&1 | tee build.log || status=$?
          set +e  # a grep that matches nothing must not end the script
          grep -E '^e: ' build.log | head -50 | while IFS= read -r line; do
            msg="${line#e: }"
            # "file:///path/File.kt:12:5 message" → file + line annotation
            if [[ "$msg" =~ ^file://([^:]+):([0-9]+):([0-9]+)\ (.*)$ ]]; then
              f="${BASH_REMATCH[1]#$GITHUB_WORKSPACE/}"
              echo "::error file=$f,line=${BASH_REMATCH[2]},col=${BASH_REMATCH[3]}::${BASH_REMATCH[4]}"
            else
              echo "::error::$msg"
            fi
          done
          if [ "$status" != 0 ] && ! grep -qE '^e: ' build.log; then
            # Not a Kotlin error: surface Gradle's own explanation instead.
            grep -A12 -E 'What went wrong|FAILURE:|error:' build.log | head -40 | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error::$line"
            done
          fi
          if [ "$status" != 0 ]; then
            # Annotations are capped at 10 per step, so also send the log tail
            # as one multi-line annotation (%0A is a newline there).
            tail -n 80 build.log | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}' | sed 's/^/::warning title=build.log tail::/'; echo
          fi
          exit $status
