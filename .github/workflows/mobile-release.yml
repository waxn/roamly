name: Build and Release Android App

on:
  push:
    tags:
      - 'mobile-v*'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Decode upload keystore
        run: echo "${{ secrets.ROAMLY_UPLOAD_STORE_BASE64 }}" | base64 -d > roamly-upload.jks

      - name: Build signed release APK
        env:
          ROAMLY_UPLOAD_STORE_FILE: roamly-upload.jks
          ROAMLY_UPLOAD_STORE_PASSWORD: ${{ secrets.ROAMLY_UPLOAD_STORE_PASSWORD }}
          ROAMLY_UPLOAD_KEY_ALIAS: ${{ secrets.ROAMLY_UPLOAD_KEY_ALIAS }}
          ROAMLY_UPLOAD_KEY_PASSWORD: ${{ secrets.ROAMLY_UPLOAD_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Clean up keystore
        if: always()
        run: rm -f roamly-upload.jks

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: mobile/app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
