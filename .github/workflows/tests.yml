name: Tests

# Lint + pytest against a real PostGIS, the way the app runs. Called by
# docker-publish.yml before it builds, so an image is only pushed when the
# suite passes; also runnable by hand and on pull requests.
on:
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    # The Dockerfile's own base image, so CI installs the same Debian packages
    # the app runs on rather than whatever the runner's Ubuntu calls them.
    container: python:3.13-slim
    permissions:
      contents: read

    services:
      db:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_USER: roamly
          POSTGRES_PASSWORD: roamly
          POSTGRES_DB: roamly
        options: >-
          --health-cmd "pg_isready -U roamly"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:8.10-alpine

    env:
      # Services are reached by name from inside a container job.
      DATABASE_URL: postgis://roamly:roamly@db:5432/roamly
      REDIS_URL: redis://redis:6379/1
      SECRET_KEY: ci-only-not-a-secret
      DEBUG: 'False'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install GeoDjango system libraries
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            binutils libproj-dev gdal-bin libgdal-dev libgeos-dev libpq-dev gcc ffmpeg

      - name: Install dependencies
        run: pip install --no-cache-dir -c constraints.txt -r requirements.txt -r requirements-dev.txt

      # Only the rules that mean "this cannot work": syntax errors and
      # undefined names. pyproject.toml's wider set is for local use until the
      # existing findings are worked through.
      - name: Lint
        run: ruff check tracker roamly --select E9,F63,F7,F82

      # Pages render through the manifest static storage, which the container
      # builds with collectstatic on start; without it every page 500s.
      - name: Collect static files
        run: python manage.py collectstatic --noinput -v 0

      # Failures are re-emitted as workflow annotations, which (unlike job
      # logs) can be read without auth on a public repo — same as mobile-check.
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          status=0
          pytest --create-db -q -rfE --tb=line 2>&1 | tee pytest.log || status=$?
          set +e
          grep -E '^(FAILED|ERROR) ' pytest.log | head -40 | while IFS= read -r line; do
            echo "::error::${line}"
          done
          grep -E '^E  +' pytest.log | head -40 | while IFS= read -r line; do
            echo "::warning::${line}"
          done
          exit $status
