services:
  redis:
    image: redis:7-alpine
    container_name: roamly_redis
    restart: unless-stopped
    volumes:
      - ./data/redis:/data

  db:
    image: postgis/postgis:16-3.4
    container_name: roamly_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: roamly
      POSTGRES_USER: roamly
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./docker-init:/docker-entrypoint-initdb.d
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roamly -d roamly"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    image: waxn/roamly:latest
    # To build locally instead of pulling the published image:
    #   build: .
    container_name: roamly_web
    restart: unless-stopped
    depends_on:
      - redis
      - db
    dns:
      - 1.1.1.1
      - 8.8.8.8
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn roamly.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 300"
    volumes:
      - ./staticfiles:/app/staticfiles
      - ./media:/app/media
      - ./tracker/migrations:/app/tracker/migrations
    ports:
      - "8001:8000"
    environment:
      - DEBUG=${DEBUG:-True}
      - SECRET_KEY=${SECRET_KEY:-django-insecure-change-me-in-production}
      - DATABASE_URL=${DATABASE_URL}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-http://localhost,http://127.0.0.1}
      - REDIS_URL=redis://redis:6379/1
