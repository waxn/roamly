services:
  db:
    image: postgis/postgis:16-3.4
    container_name: roamly_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: roamly
      POSTGRES_USER: roamly
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-roamly_secret}
    volumes:
      - postgis_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roamly -d roamly"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: roamly_web
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn roamly.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 300"
    volumes:
      - ./staticfiles:/app/staticfiles
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DEBUG=${DEBUG:-False}
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - DATABASE_URL=postgis://roamly:${POSTGRES_PASSWORD:-roamly_secret}@db:5432/roamly
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1}

volumes:
  postgis_data:
