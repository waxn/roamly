{% extends 'tracker/base.html' %}
{% block title %}Activity - Roamly{% endblock %}

{% block extra_css %}
<style>
.ad-back { color: var(--text-muted); text-decoration: none; font-size: 0.75rem;
           font-family: var(--font-mono); }
.ad-back:hover { color: var(--primary); }
.ad-glyph { font-size: 1.5rem; margin-right: 0.5rem; }
.ad-when { color: var(--text-muted); font-size: 0.75rem; font-family: var(--font-mono);
           margin-top: 0.2rem; }
.ad-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(8rem, 1fr));
            gap: 0.75rem; margin-bottom: 1rem; }
.ad-stat { padding: 1rem 1.1rem; background: var(--bg-card); border: 1px solid var(--border);
           border-radius: var(--radius); }
.ad-stat .v { font-family: var(--font-mono); font-size: 1.35rem; font-weight: 600; }
.ad-stat .l { color: var(--text-muted); font-size: 0.6875rem; margin-top: 0.15rem; }
#ad-map { height: 26rem; border-radius: var(--radius); overflow: hidden; }
.ad-chart-wrap { position: relative; }
.ad-chart { width: 100%; height: 12rem; display: block; cursor: crosshair; }
.ad-tip { position: absolute; top: 0.25rem; pointer-events: none; padding: 0.2rem 0.45rem;
          background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 4px;
          font-family: var(--font-mono); font-size: 0.6875rem; white-space: nowrap; display: none; }
.ad-legend { display: flex; align-items: center; gap: 0.5rem; margin-top: 0.6rem;
             font-family: var(--font-mono); font-size: 0.6875rem; color: var(--text-muted); }
.ad-legend .ramp { width: 7rem; height: 6px; border-radius: 3px;
                   background: linear-gradient(90deg, #3b82f6, #22c55e, #f59e0b, #ef4444); }
.ad-pending { color: var(--clay-amber); font-size: 0.8125rem; font-family: var(--font-mono); }
.ad-note { color: var(--text-muted); font-size: 0.75rem; margin-top: 0.6rem;
           font-family: var(--font-mono); }
</style>
{% endblock %}

{% block content %}
<div class="container">
    <a class="ad-back" href="{% url 'tracker:activities' %}">&larr; activities</a>

    <div class="page-toolbar">
        <div>
            <h1><span class="ad-glyph" id="ad-glyph">📍</span><span id="ad-title">loading…</span></h1>
            <div class="ad-when" id="ad-when"></div>
        </div>
        <div class="toolbar-actions">
            <a class="btn" id="ad-gpx" href="/api/activities/{{ activity_id }}/gpx/" download>GPX</a>
            <button class="btn" id="ad-rename">Rename</button>
            <button class="btn btn-danger" id="ad-delete">Delete</button>
        </div>
    </div>

    <div class="ad-stats" id="ad-stats" aria-busy="true">
        <div class="ad-stat"><div class="v"><span class="skeleton skel-statval"></span></div><div class="l">distance</div></div>
        <div class="ad-stat"><div class="v"><span class="skeleton skel-statval"></span></div><div class="l">moving</div></div>
        <div class="ad-stat"><div class="v"><span class="skeleton skel-statval"></span></div><div class="l">elapsed</div></div>
        <div class="ad-stat"><div class="v"><span class="skeleton skel-statval"></span></div><div class="l">avg</div></div>
    </div>

    <div class="card">
        <div class="card-header">Route</div>
        <div id="ad-map"></div>
        <div class="ad-legend" id="ad-legend" hidden>
            <span id="ad-legend-lo"></span><span class="ramp"></span><span id="ad-legend-hi"></span>
        </div>
        <div class="ad-note" id="ad-note"></div>
    </div>

    <div class="card">
        <div class="card-header">Speed</div>
        <div class="ad-chart-wrap" id="ad-speed-wrap">
            <canvas class="ad-chart" id="ad-speed"></canvas><div class="ad-tip"></div>
        </div>
    </div>

    <div class="card" id="ad-elev-card" hidden>
        <div class="card-header">Elevation</div>
        <div class="ad-chart-wrap" id="ad-elev-wrap">
            <canvas class="ad-chart" id="ad-elev"></canvas><div class="ad-tip"></div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
const ACTIVITY_ID = {{ activity_id }};
const csrfToken = '{{ csrf_token }}';
const GLYPH = { ride:'🚲', run:'🏃', walk:'🚶', hike:'🥾', row:'🚣', other:'📍' };
const LABEL = { ride:'Ride', run:'Run', walk:'Walk', hike:'Hike', row:'Row', other:'Activity' };
// The same blue→green→amber→red functional ramp as the main map's speed
// gradient, but stretched over THIS activity's own speed range (5th–95th
// percentile) — on an absolute 1–30 m/s scale a whole walk would be one colour.
const RAMP = ['#3b82f6', '#22c55e', '#f59e0b', '#ef4444'];

const theme = localStorage.getItem('roamly_theme') || 'dark';
const basemap = theme === 'light'
    ? 'https://basemaps.cartocdn.com/light_all/{z}/{x}/{y}.png{{ CARTO_TILE_QS|escapejs }}'
    : 'https://basemaps.cartocdn.com/dark_all/{z}/{x}/{y}.png{{ CARTO_TILE_QS|escapejs }}';

let amap = null, amapLoaded = false;

function isImperial() { return (localStorage.getItem('roamly_speed_unit') || 'kmh') === 'mph'; }
function toDist(km) { return isImperial() ? km * 0.621371 : km; }
function distUnit() { return isImperial() ? 'mi' : 'km'; }
function speedUnit() { return isImperial() ? 'mph' : 'km/h'; }
function cssVar(n, fb) {
    return getComputedStyle(document.documentElement).getPropertyValue(n).trim() || fb;
}
function escapeHtml(s) {
    return String(s ?? '').replace(/[&<>"']/g, c =>
        ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
}
function toElev(m) { return isImperial() ? m * 3.28084 : m; }
function elevUnit() { return isImperial() ? 'ft' : 'm'; }
function percentile(sorted, p) {
    if (!sorted.length) return 0;
    const i = Math.min(sorted.length - 1, Math.max(0, Math.round(p * (sorted.length - 1))));
    return sorted[i];
}
function fmtDuration(s) {
    if (!s) return '—';
    const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
    return h > 0 ? `${h}h ${m}m` : `${m}m`;
}

/** Round tick *step* (1/2/2.5/5 x 10^n), then multiply — the same approach
 *  health.html uses, because rounding the ceiling instead puts gridlines on
 *  values the labels never show. */
function niceAxis(max, ticks) {
    if (!(max > 0)) return { top: 1, step: 1 / ticks };
    const raw = max / ticks;
    const mag = Math.pow(10, Math.floor(Math.log10(raw)));
    const n = raw / mag;
    const step = (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * mag;
    return { top: step * ticks, step };
}

function renderActivity(a) {
    document.getElementById('ad-glyph').textContent = GLYPH[a.kind] || GLYPH.other;
    document.getElementById('ad-title').textContent = a.title || LABEL[a.kind] || 'activity';
    document.getElementById('ad-when').textContent =
        new Date(a.start).toLocaleString([], { dateStyle: 'full', timeStyle: 'short' });

    const stats = document.getElementById('ad-stats');
    stats.setAttribute('aria-busy', 'false');
    if (a.computed_at === null) {
        stats.innerHTML = `<div class="ad-pending">Waiting for this activity's points to finish
            uploading. The figures fill in by themselves once they land.</div>`;
        return;
    }
    const tile = (v, l) => `<div class="ad-stat"><div class="v">${v}</div><div class="l">${l}</div></div>`;
    const tiles = [
        tile(toDist(a.distance_km ?? 0).toFixed(2) + ' ' + distUnit(), 'distance'),
        tile(fmtDuration(a.moving_seconds), 'moving'),
        tile(fmtDuration(a.elapsed_seconds), 'elapsed'),
        tile((a.avg_speed_kmh != null ? toDist(a.avg_speed_kmh).toFixed(1) : '—') + ' ' + speedUnit(), 'avg speed'),
        tile((a.max_speed_kmh != null ? toDist(a.max_speed_kmh).toFixed(1) : '—') + ' ' + speedUnit(), 'max speed'),
    ];
    if (a.elevation_gain_m != null) {
        tiles.push(tile(Math.round(toElev(a.elevation_gain_m)).toLocaleString() + ' ' + elevUnit(), 'elevation gain'));
    }
    tiles.push(tile((a.point_count || 0).toLocaleString(), a.source === 'track' ? 'recorded points' : 'points'));
    stats.innerHTML = tiles.join('');
}

function ensureMap() {
    if (amap) return;
    amap = new maplibregl.Map({
        container: 'ad-map',
        style: {
            version: 8,
            sources: { base: { type:'raster', tiles:[basemap], tileSize:256,
                               attribution:'© OpenStreetMap © CARTO' } },
            layers: [{ id:'base', type:'raster', source:'base' }],
        },
        center: [0, 20], zoom: 1, attributionControl: false,
    });
    amap.on('load', () => { amapLoaded = true; });
}

let hoverMarker = null;

function renderTrack(track) {
    ensureMap();
    const note = document.getElementById('ad-note');
    if (!track.segments || !track.segments.length) {
        note.textContent = 'No GPS points landed in this activity’s window yet.';
        return;
    }
    const verts = track.segments.reduce((n, s) => n + s.length, 0);
    note.textContent = track.source === 'track'
        ? `${track.point_count.toLocaleString()} recorded points · cleaned + smoothed · ${verts.toLocaleString()} drawn`
        : `${track.point_count.toLocaleString()} history points · cleaned + smoothed · ${verts.toLocaleString()} drawn`;

    // One two-point feature per hop, coloured by the hop's mean speed relative
    // to this activity's own range.
    const all = [];
    track.speeds.forEach(seg => seg.forEach(v => all.push(v)));
    all.sort((x, y) => x - y);
    const lo = percentile(all, 0.05), hi = Math.max(percentile(all, 0.95), lo + 0.5);
    const features = [];
    track.segments.forEach((seg, si) => {
        for (let i = 1; i < seg.length; i++) {
            features.push({ type: 'Feature',
                properties: { s: (track.speeds[si][i - 1] + track.speeds[si][i]) / 2 },
                geometry: { type: 'LineString', coordinates: [seg[i - 1], seg[i]] } });
        }
    });
    const gradientOn = (localStorage.getItem('roamly_speed_gradient') || 'on') === 'on';
    const legend = document.getElementById('ad-legend');
    if (gradientOn) {
        legend.hidden = false;
        document.getElementById('ad-legend-lo').textContent = toDist(lo).toFixed(1);
        document.getElementById('ad-legend-hi').textContent = toDist(hi).toFixed(1) + ' ' + speedUnit();
    }
    const step = (hi - lo) / 3;
    const color = gradientOn
        ? ['interpolate', ['linear'], ['get', 's'],
           lo, RAMP[0], lo + step, RAMP[1], lo + 2 * step, RAMP[2], hi, RAMP[3]]
        : '#e8763d';

    const draw = () => {
        if (!amapLoaded) { setTimeout(draw, 60); return; }
        amap.resize();
        ['ad-casing','ad-line','ad-start','ad-end'].forEach(id => { if (amap.getLayer(id)) amap.removeLayer(id); });
        ['line','startend'].forEach(id => { if (amap.getSource(id)) amap.removeSource(id); });

        amap.addSource('line', { type:'geojson', data:{ type:'FeatureCollection', features } });
        // A dark casing under the coloured line keeps it legible on both basemaps.
        amap.addLayer({ id:'ad-casing', type:'line', source:'line',
            layout:{ 'line-join':'round', 'line-cap':'round' },
            paint:{ 'line-color':'#111', 'line-width':6.5, 'line-opacity':0.55 } });
        amap.addLayer({ id:'ad-line', type:'line', source:'line',
            layout:{ 'line-join':'round', 'line-cap':'round' },
            paint:{ 'line-color': color, 'line-width':4 } });

        if (track.start && track.end) {
            amap.addSource('startend', { type:'geojson', data:{ type:'FeatureCollection', features:[
                { type:'Feature', properties:{kind:'start'}, geometry:{type:'Point', coordinates:track.start} },
                { type:'Feature', properties:{kind:'end'},   geometry:{type:'Point', coordinates:track.end} },
            ]}});
            amap.addLayer({ id:'ad-start', type:'circle', source:'startend', filter:['==','kind','start'],
                paint:{ 'circle-radius':7, 'circle-color':'#22c55e', 'circle-stroke-width':2.5, 'circle-stroke-color':'#fff' } });
            amap.addLayer({ id:'ad-end', type:'circle', source:'startend', filter:['==','kind','end'],
                paint:{ 'circle-radius':7, 'circle-color':'#d0694a', 'circle-stroke-width':2.5, 'circle-stroke-color':'#fff' } });
        }

        const b = new maplibregl.LngLatBounds();
        track.segments.forEach(seg => seg.forEach(c => b.extend(c)));
        if (!b.isEmpty()) amap.fitBounds(b, { padding:40, maxZoom:16, duration:300 });
    };
    setTimeout(draw, 120);
}

function showOnMap(coord) {
    if (!amap) return;
    if (!coord) { if (hoverMarker) { hoverMarker.remove(); hoverMarker = null; } return; }
    if (!hoverMarker) {
        const el = document.createElement('div');
        el.style.cssText = 'width:12px;height:12px;border-radius:50%;background:#fff;' +
                           'border:3px solid #e8763d;box-shadow:0 0 0 2px rgba(0,0,0,.35)';
        hoverMarker = new maplibregl.Marker({ element: el });
    }
    hoverMarker.setLngLat(coord).addTo(amap);
}

/** A value-over-TIME chart, hand-rolled on canvas (this app has no charting
 *  library). Time, not point index, on x — otherwise a dense stretch is drawn
 *  wide and a sparse one narrow — and each gap-split segment is drawn as its
 *  own run so a tracking hole reads as a break, not a straight ramp.
 *  ``ceilP`` sets the y-axis from a percentile, so one leftover spike can't
 *  flatten the whole chart. Hovering links back to the map. */
function drawTimeChart(cfg) {
    const { canvasId, wrapId, times, values, coords, unit, fmt, ceilP, floorToMin } = cfg;
    const canvas = document.getElementById(canvasId);
    const wrap = document.getElementById(wrapId);
    const tip = wrap.querySelector('.ad-tip');
    const pts = [];   // flattened [t, v, coord, segIndex]
    times.forEach((seg, si) => seg.forEach((t, i) => {
        const v = values[si][i];
        if (v != null) pts.push([t, v, coords[si][i], si]);
    }));
    const dpr = window.devicePixelRatio || 1;
    const w = wrap.clientWidth, h = 200;
    canvas.width = w * dpr; canvas.height = h * dpr;
    canvas.style.height = h + 'px';
    const ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);
    if (pts.length < 2) {
        ctx.fillStyle = cssVar('--text-muted', '#888');
        ctx.font = '13px system-ui';
        ctx.fillText('Not enough points to chart.', 12, h / 2);
        return;
    }
    const sorted = pts.map(p => p[1]).sort((a, b) => a - b);
    const vMax = ceilP ? percentile(sorted, ceilP) * 1.08 : sorted[sorted.length - 1];
    let vMin = 0;
    if (floorToMin) vMin = sorted[0];
    const TICKS = 4;
    const span = Math.max(vMax - vMin, 1e-6);
    const { step } = niceAxis(span, TICKS);
    const base = floorToMin ? Math.floor(vMin / step) * step : 0;
    const top = base + step * Math.ceil((vMax - base) / step || 1);
    const t0 = pts[0][0], t1 = pts[pts.length - 1][0];

    ctx.font = '11px ui-monospace, monospace';
    let gutter = 0;
    for (let v = base; v <= top + 1e-9; v += step) gutter = Math.max(gutter, ctx.measureText(fmt(v)).width);
    const padL = gutter + 12, padR = 8, padT = 12, padB = 22;
    const plotW = w - padL - padR, plotH = h - padT - padB;
    const X = t => padL + ((t - t0) / Math.max(1, t1 - t0)) * plotW;
    const Y = v => padT + plotH - Math.max(0, Math.min(1, (v - base) / (top - base))) * plotH;

    const muted = cssVar('--text-muted', '#888');
    ctx.strokeStyle = cssVar('--border', '#333');
    ctx.fillStyle = muted;
    ctx.lineWidth = 1;
    for (let v = base; v <= top + 1e-9; v += step) {
        const y = Y(v);
        ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(w - padR, y); ctx.stroke();
        ctx.fillText(fmt(v), padL - gutter - 6, y + 4);
    }
    ctx.fillText(unit, padL - gutter - 6, padT - 3);
    // Elapsed-time ticks along x.
    const dur = t1 - t0;
    const tickS = [60, 300, 600, 900, 1800, 3600, 7200, 10800].find(s => dur / s <= 6) || 21600;
    for (let s = tickS; s < dur; s += tickS) {
        const x = X(t0 + s);
        const lbl = s >= 3600 ? `${Math.floor(s / 3600)}h${s % 3600 ? String(Math.floor(s % 3600 / 60)).padStart(2, '0') : ''}` : `${s / 60}m`;
        ctx.fillText(lbl, x - ctx.measureText(lbl).width / 2, h - 6);
    }

    const primary = cssVar('--primary', '#e8763d');
    const runs = [];
    pts.forEach(p => {
        if (!runs.length || runs[runs.length - 1][0][3] !== p[3]) runs.push([]);
        runs[runs.length - 1].push(p);
    });
    runs.forEach(run => {
        ctx.beginPath();
        run.forEach((p, i) => i ? ctx.lineTo(X(p[0]), Y(p[1])) : ctx.moveTo(X(p[0]), Y(p[1])));
        ctx.strokeStyle = primary; ctx.lineWidth = 1.75; ctx.stroke();
        ctx.lineTo(X(run[run.length - 1][0]), padT + plotH);
        ctx.lineTo(X(run[0][0]), padT + plotH);
        ctx.closePath();
        ctx.globalAlpha = 0.12; ctx.fillStyle = primary; ctx.fill(); ctx.globalAlpha = 1;
    });

    const snapshot = ctx.getImageData(0, 0, canvas.width, canvas.height);
    canvas.onmousemove = ev => {
        const r = canvas.getBoundingClientRect();
        const t = t0 + ((ev.clientX - r.left - padL) / plotW) * (t1 - t0);
        let lo = 0, hi = pts.length - 1;
        while (lo < hi) { const m = (lo + hi) >> 1; pts[m][0] < t ? lo = m + 1 : hi = m; }
        if (lo > 0 && Math.abs(pts[lo - 1][0] - t) < Math.abs(pts[lo][0] - t)) lo--;
        const p = pts[lo];
        ctx.putImageData(snapshot, 0, 0);
        const x = X(p[0]);
        ctx.strokeStyle = muted; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(x, padT); ctx.lineTo(x, padT + plotH); ctx.stroke();
        ctx.fillStyle = primary;
        ctx.beginPath(); ctx.arc(x, Y(p[1]), 3.5, 0, Math.PI * 2); ctx.fill();
        const el = p[0] - t0;
        tip.textContent = `${fmt(p[1])} ${unit} · ${fmtDuration(el) === '—' ? '0m' : fmtDuration(el)}`;
        tip.style.display = 'block';
        tip.style.left = Math.min(Math.max(0, x - tip.offsetWidth / 2), w - tip.offsetWidth) + 'px';
        showOnMap(p[2]);
    };
    canvas.onmouseleave = () => {
        ctx.putImageData(snapshot, 0, 0);
        tip.style.display = 'none';
        showOnMap(null);
    };
}

function drawCharts(track) {
    if (!track.segments || !track.segments.length) return;
    drawTimeChart({
        canvasId: 'ad-speed', wrapId: 'ad-speed-wrap', times: track.times,
        values: track.speeds.map(seg => seg.map(v => toDist(v))),
        coords: track.segments, unit: speedUnit(), ceilP: 0.99,
        fmt: v => (Math.round(v * 10) / 10).toString(),
    });
    const elev = (track.elevations || []).map(seg => seg.map(v => v == null ? null : toElev(v)));
    if (elev.some(seg => seg.some(v => v != null))) {
        document.getElementById('ad-elev-card').hidden = false;
        drawTimeChart({
            canvasId: 'ad-elev', wrapId: 'ad-elev-wrap', times: track.times, values: elev,
            coords: track.segments, unit: elevUnit(), floorToMin: true,
            fmt: v => Math.round(v).toString(),
        });
    }
}

async function rename() {
    const current = document.getElementById('ad-title').textContent;
    // roamlyPrompt, not window.prompt — this was the last native browser dialog
    // left in the app, on a page already using roamlyConfirm and roamlyToast.
    const answers = await window.roamlyPrompt('What should this activity be called?', {
        title: 'Rename activity', confirmText: 'Save',
        fields: [{name: 'title', label: 'Activity name', placeholder: current}],
    });
    if (!answers) return;
    const next = (answers.title || '').trim();
    try {
        await window.roamlyFetch(`/api/activities/${ACTIVITY_ID}/update/`, {
            method: 'POST', json: { title: next }, toast: false,
        });
        document.getElementById('ad-title').textContent = next || 'Activity';
        window.roamlyToast('Renamed', { type: 'success' });
    } catch (e) {
        window.roamlyToast(e.message || 'Could not rename', { type: 'error' });
    }
}

async function remove() {
    const ok = await window.roamlyConfirm(
        'Delete this activity? Its recorded track is removed; the copy in your location ' +
        'history stays.',
        { title: 'Delete activity', danger: true, confirmText: 'Delete' });
    if (!ok) return;
    try {
        await window.roamlyFetch(`/api/activities/${ACTIVITY_ID}/delete/`, {
            method: 'POST', toast: false,
        });
        window.location.href = '/activities/';
    } catch (e) {
        window.roamlyToast(e.message || 'Could not delete', { type: 'error' });
    }
}

document.getElementById('ad-rename').addEventListener('click', rename);
document.getElementById('ad-delete').addEventListener('click', remove);

// Both on-load fetches had no .catch() and no r.ok check, so any failure left
// the page rendered empty with nothing to explain it.
(async function loadDetail() {
    try {
        const d = await window.roamlyFetch(`/api/activities/${ACTIVITY_ID}/`,
                                           {errorMessage: "Couldn't load this activity"});
        if (d.activity) renderActivity(d.activity);
    } catch (e) { /* roamlyFetch has already toasted */ }
})();

(async function loadTrack() {
    try {
        const d = await window.roamlyFetch(`/api/activities/${ACTIVITY_ID}/track/`,
                                           {errorMessage: "Couldn't load the track"});
        renderTrack(d);
        drawCharts(d);
        let rt = null;
        window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => drawCharts(d), 150); });
    } catch (e) { /* roamlyFetch has already toasted */ }
})();
</script>
{% endblock %}
