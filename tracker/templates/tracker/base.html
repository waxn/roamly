<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>{% block title %}Roamly{% endblock %}</title>
    {% load static %}
    <meta name="description" content="{% block meta_description %}Roamly — private GPS tracking, trip sharing, and travel analytics. Own your location data.{% endblock %}">
    <link rel="canonical" href="{% block canonical %}{{ request.scheme }}://{{ request.get_host }}{{ request.path }}{% endblock %}">
    <meta name="robots" content="{% block robots_meta %}index, follow{% endblock %}">
    <meta property="og:site_name" content="Roamly">
    <meta property="og:type" content="website">
    <meta property="og:title" content="{% block og_title %}Roamly{% endblock %}">
    <meta property="og:description" content="{% block og_description %}Roamly — private GPS tracking, trip sharing, and travel analytics.{% endblock %}">
    <meta property="og:url" content="{{ request.scheme }}://{{ request.get_host }}{{ request.path }}">
    <meta property="og:image" content="{% block og_image %}{{ request.scheme }}://{{ request.get_host }}{% static 'tracker/roamly.png' %}{% endblock %}">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{% block twitter_title %}Roamly{% endblock %}">
    <meta name="twitter:description" content="{% block twitter_description %}Own your location data.{% endblock %}">
    <meta name="twitter:image" content="{{ request.scheme }}://{{ request.get_host }}{% static 'tracker/roamly.png' %}">
    <link rel="icon" type="image/x-icon" href="{% static 'tracker/roamlymark.ico' %}">
    <link rel="manifest" href="{% static 'tracker/manifest.json' %}">
    <meta name="theme-color" content="#0a0c12">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="{% static 'tracker/icon-192.png' %}">
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.1.2/dist/maplibre-gl.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0c12;
            --bg-card: #11151f;
            --bg-glass: rgba(17, 21, 31, 0.82);
            --bg-input: #161b28;
            --border: rgba(255, 255, 255, 0.08);
            --border-bright: rgba(59, 130, 246, 0.35);
            --text: #e8ecf4;
            --text-muted: #8b92a8;
            --text-dim: #555b72;
            --primary: #3b82f6;
            --primary-soft: rgba(59, 130, 246, 0.14);
            --primary-hover: #2563eb;
            --accent: #f59e0b;
            --danger: #ef4444;
            --success: #22c55e;
            --warning: #f59e0b;
            --nav-h: 56px;
            --bottom-nav-height: 0px;
            --font-display: 'Syne', sans-serif;
            --font-body: 'IBM Plex Sans', sans-serif;
            --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
            --radius-lg: 16px;
            --shadow-card: 0 12px 40px rgba(0, 0, 0, 0.28);
        }

        [data-theme="light"] {
            --bg: #f4f5f8;
            --bg-card: #ffffff;
            --bg-glass: rgba(255, 255, 255, 0.88);
            --bg-input: #eef0f5;
            --border: rgba(0, 0, 0, 0.1);
            --border-bright: rgba(59, 130, 246, 0.45);
            --text: #1a1d26;
            --text-muted: #5c6370;
            --text-dim: #9ca3af;
            --primary-soft: rgba(59, 130, 246, 0.1);
            --shadow-card: 0 8px 30px rgba(15, 23, 42, 0.08);
        }
        [data-theme="light"] .alert-error {
            background: rgba(239,68,68,0.1);
            color: #dc2626;
            border-color: rgba(239,68,68,0.3);
        }
        [data-theme="light"] .alert-success {
            background: rgba(34,197,94,0.1);
            color: #16a34a;
            border-color: rgba(34,197,94,0.3);
        }
        [data-theme="light"] .alert-info {
            background: rgba(59,130,246,0.1);
            color: #2563eb;
            border-color: rgba(59,130,246,0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: var(--font-body);
            text-transform: lowercase;
            font-weight: 400;
            font-size: 0.9375rem;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding-bottom: var(--bottom-nav-height);
            display: flex;
            flex-direction: column;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 70% 45% at 12% -8%, rgba(59, 130, 246, 0.1), transparent 55%),
                radial-gradient(ellipse 45% 30% at 92% 0%, rgba(245, 158, 11, 0.04), transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        body > .container,
        body > [class*="container"] {
            flex: 1;
            position: relative;
            z-index: 1;
        }

        /* Navbar */
        .navbar {
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
            padding: 0 1.5rem;
            height: var(--nav-h);
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            column-gap: 1rem;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .navbar-start {
            justify-self: start;
            display: flex;
            align-items: center;
            min-width: 0;
        }
        .navbar-brand {
            text-decoration: none;
            display: flex;
            align-items: center;
        }
        .navbar-logo {
            height: 40px;
            width: auto;
        }
        .navbar-center {
            justify-self: center;
            display: flex;
            justify-content: center;
            min-width: 0;
        }
        .navbar-nav {
            display: flex;
            gap: 0.25rem;
            list-style: none;
            flex-wrap: nowrap;
        }
        .navbar-nav a {
            color: var(--text-muted);
            text-decoration: none;
            padding: 0.5rem 0.75rem;
            border-radius: 8px;
            font-size: 0.875rem;
            font-weight: 500;
            white-space: nowrap;
            transition: color 0.15s, background 0.15s;
        }
        .navbar-nav a:hover {
            color: var(--text);
            background: var(--bg-input);
        }
        .navbar-nav a.active {
            color: var(--primary);
            background: transparent;
            font-weight: 600;
        }
        .navbar-end {
            justify-self: end;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            min-width: 0;
        }
        .navbar-user {
            color: var(--text-muted);
            font-size: 0.875rem;
            max-width: 10rem;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* Bottom Navigation (mobile only) */
        .bottom-nav {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 64px;
            background: var(--bg-glass);
            backdrop-filter: blur(16px) saturate(1.15);
            -webkit-backdrop-filter: blur(16px) saturate(1.15);
            border-top: 1px solid var(--border);
            z-index: 1000;
            padding-bottom: env(safe-area-inset-bottom, 0px);
            box-shadow: 0 -8px 32px rgba(0, 0, 0, 0.25);
        }
        .bottom-nav-inner {
            display: flex;
            align-items: center;
            justify-content: space-around;
            height: 64px;
        }
        .bottom-nav a {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.625rem;
            font-weight: 600;
            padding: 6px 0;
            min-width: 48px;
            transition: color 0.15s;
        }
        .bottom-nav a.active {
            color: var(--primary);
            position: relative;
        }
        .bottom-nav a.active::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 50%;
            transform: translateX(-50%);
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: var(--primary);
            box-shadow: 0 0 8px var(--primary);
        }
        .bottom-nav a svg {
            width: 22px;
            height: 22px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* Layout */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: clamp(1.25rem, 3vw, 1.75rem);
        }
        .page-header {
            margin-bottom: 1.5rem;
        }
        .page-header h1 {
            font-family: var(--font-display);
            font-size: clamp(1.35rem, 3vw, 1.75rem);
            font-weight: 800;
            letter-spacing: -0.02em;
            line-height: 1.1;
        }
        .page-header .page-lead {
            margin-top: 0.35rem;
            font-size: 0.9rem;
            color: var(--text-muted);
            font-weight: 400;
            max-width: 36rem;
        }
        .page-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
        }
        .page-toolbar h1 {
            font-family: var(--font-display);
            font-size: clamp(1.35rem, 3vw, 1.75rem);
            font-weight: 800;
            letter-spacing: -0.02em;
        }
        .toolbar-actions {
            display: flex;
            gap: 0.5rem;
            align-items: center;
            flex-wrap: wrap;
        }

        /* Pill tabs (visits, etc.) */
        .pill-tabs {
            display: inline-flex;
            gap: 0.35rem;
            padding: 0.35rem;
            background: var(--bg-glass);
            border: 1px solid var(--border);
            border-radius: 999px;
            margin-bottom: 1.25rem;
            backdrop-filter: blur(8px);
        }
        .pill-tabs .tab-btn,
        .pill-tabs button.tab-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            padding: 0.45rem 1rem;
            border-radius: 10px;
            font-size: 0.8125rem;
            font-family: var(--font-body);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s var(--ease-out);
        }
        .pill-tabs .tab-btn:hover {
            color: var(--text);
        }
        .pill-tabs .tab-btn.active {
            background: var(--primary);
            color: #fff;
            box-shadow: 0 4px 14px rgba(59, 130, 246, 0.3);
        }

        /* Cards */
        .card {
            background: var(--bg-glass);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 1.25rem;
            margin-bottom: 1rem;
            backdrop-filter: blur(10px);
            transition: border-color 0.3s, box-shadow 0.3s var(--ease-out);
        }
        .card:hover {
            border-color: var(--border-bright);
            box-shadow: var(--shadow-card);
        }
        .card-header {
            font-family: var(--font-display);
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 1rem;
            padding-bottom: 0.75rem;
            border-bottom: 1px solid var(--border);
        }

        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            border-radius: 10px;
            border: none;
            font-size: 0.8125rem;
            font-weight: 600;
            font-family: var(--font-body);
            cursor: pointer;
            transition: transform 0.2s var(--ease-out), box-shadow 0.2s, background 0.2s, border-color 0.2s, color 0.2s;
            text-decoration: none;
            color: var(--text);
        }
        .btn-primary {
            background: var(--primary);
            color: #fff;
        }
        .btn-primary:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.35);
        }
        .btn-danger {
            background: var(--danger);
            color: #fff;
        }
        .btn-danger:hover { opacity: 0.9; }
        .btn-outline {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-muted);
        }
        .btn-outline:hover {
            border-color: var(--text-muted);
            color: var(--text);
        }
        .btn-sm { padding: 0.375rem 0.75rem; font-size: 0.8125rem; }

        /* Forms */
        .form-group {
            margin-bottom: 1rem;
        }
        .form-group label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 0.375rem;
            color: var(--text-muted);
        }
        .form-control {
            width: 100%;
            padding: 0.5rem 0.75rem;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: var(--bg-input);
            color: var(--text);
            font-size: 0.875rem;
            font-family: var(--font-body);
            font-weight: 500;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .form-control:focus {
            border-color: var(--border-bright);
            box-shadow: 0 0 0 3px var(--primary-soft);
        }
        select.form-control {
            appearance: none;
            cursor: pointer;
        }

        /* Tables */
        .table-responsive { overflow-x: auto; }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.875rem;
        }
        th, td {
            padding: 0.625rem 0.75rem;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }
        th {
            color: var(--text-muted);
            font-weight: 600;
            font-size: 0.75rem;
            letter-spacing: 0.03em;
        }
        tr:hover { background: rgba(128,128,128,0.06); }

        /* Grid */
        .grid { display: grid; gap: 1rem; }
        .grid-2 { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
        .grid-3 { grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); }
        .grid-4 { grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }

        /* Stats */
        .stat-value {
            font-family: var(--font-display);
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            color: var(--primary);
            background: linear-gradient(135deg, #60a5fa, var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        [data-theme="light"] .stat-value {
            -webkit-text-fill-color: transparent;
        }
        .stat-label {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-top: 0.35rem;
            letter-spacing: 0.02em;
        }
        .card.stat-card {
            text-align: center;
        }
        .card.stat-card:hover .stat-value {
            filter: brightness(1.1);
        }

        /* Alerts */
        .alert {
            padding: 0.75rem 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            font-size: 0.875rem;
        }
        .alert-error {
            background: rgba(239,68,68,0.15);
            color: #fca5a5;
            border: 1px solid rgba(239,68,68,0.3);
        }
        .alert-success {
            background: rgba(34,197,94,0.15);
            color: #86efac;
            border: 1px solid rgba(34,197,94,0.3);
        }
        .alert-info {
            background: rgba(59,130,246,0.15);
            color: #93c5fd;
            border: 1px solid rgba(59,130,246,0.3);
        }

        /* Badge */
        .badge {
            display: inline-block;
            padding: 0.125rem 0.5rem;
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 500;
        }
        .badge-success { background: rgba(34,197,94,0.2); color: var(--success); }
        .badge-warning { background: rgba(245,158,11,0.2); color: var(--warning); }

        /* Loading */
        .spinner {
            display: inline-block;
            width: 1.25rem;
            height: 1.25rem;
            border: 2px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Responsive */
        th.sortable { cursor: pointer; user-select: none; white-space: nowrap; }
        th.sortable:hover { color: var(--primary); }
        th.sortable .sort-arrow { font-size: 0.7em; opacity: 0.35; margin-left: 0.15em; }
        th.sortable.active-sort { color: var(--primary); }
        th.sortable.active-sort .sort-arrow { opacity: 1; }

        @media (max-width: 768px) {
            :root {
                --bottom-nav-height: calc(64px + env(safe-area-inset-bottom, 0px));
            }
            .navbar {
                display: flex;
                justify-content: space-between;
                padding: 0 1rem;
            }
            .navbar-center { display: none; }
            .navbar-user { display: none; }
            .container { padding: 1rem; }
            .bottom-nav { display: block; }
        }

        {% block extra_css %}{% endblock %}
    </style>
</head>
<body>
    {% if user.is_authenticated %}
    <nav class="navbar">
        <div class="navbar-start">
            <a href="{% url 'tracker:map' %}" class="navbar-brand">
                <img src="{% static 'tracker/roamly.svg' %}" alt="Roamly" class="navbar-logo">
            </a>
        </div>
        <div class="navbar-center">
            <ul class="navbar-nav">
                <li><a href="{% url 'tracker:map' %}" class="{% if request.resolver_match.url_name == 'map' %}active{% endif %}">Map</a></li>
                <li><a href="{% url 'tracker:data' %}" class="{% if request.resolver_match.url_name == 'data' %}active{% endif %}">Data</a></li>
                <li><a href="{% url 'tracker:stats' %}" class="{% if request.resolver_match.url_name == 'stats' %}active{% endif %}">Stats</a></li>
                <li><a href="{% url 'tracker:visits' %}" class="{% if request.resolver_match.url_name == 'visits' %}active{% endif %}">Visits</a></li>
                <li><a href="{% url 'tracker:search' %}" class="{% if request.resolver_match.url_name == 'search' %}active{% endif %}">Search</a></li>
                <li><a href="{% url 'tracker:adventures' %}" class="{% if request.resolver_match.url_name == 'adventures' %}active{% endif %}">Adventures</a></li>
                <li><a href="{% url 'tracker:settings' %}" class="{% if request.resolver_match.url_name == 'settings' %}active{% endif %}">Settings</a></li>
            </ul>
        </div>
        <div class="navbar-end">
            <span class="navbar-user" title="{{ user.username }}">{{ user.username }}</span>
            <a href="{% url 'tracker:logout' %}" class="btn btn-outline btn-sm">Logout</a>
        </div>
    </nav>

    <!-- Mobile Bottom Navigation -->
    <nav class="bottom-nav">
        <div class="bottom-nav-inner">
            <a href="{% url 'tracker:map' %}" class="{% if request.resolver_match.url_name == 'map' %}active{% endif %}">
                <svg viewBox="0 0 24 24"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/></svg>
                map
            </a>
            <a href="{% url 'tracker:data' %}" class="{% if request.resolver_match.url_name == 'data' %}active{% endif %}">
                <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
                data
            </a>
            <a href="{% url 'tracker:stats' %}" class="{% if request.resolver_match.url_name == 'stats' %}active{% endif %}">
                <svg viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
                stats
            </a>
            <a href="{% url 'tracker:visits' %}" class="{% if request.resolver_match.url_name == 'visits' %}active{% endif %}">
                <svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
                visits
            </a>
            <a href="{% url 'tracker:search' %}" class="{% if request.resolver_match.url_name == 'search' %}active{% endif %}">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                search
            </a>
            <a href="{% url 'tracker:adventures' %}" class="{% if request.resolver_match.url_name == 'adventures' %}active{% endif %}">
                <svg viewBox="0 0 24 24"><path d="M17.8 19.2L16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/></svg>
                adventures

            <a href="{% url 'tracker:settings' %}" class="{% if request.resolver_match.url_name == 'settings' %}active{% endif %}">
