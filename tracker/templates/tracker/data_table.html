{% extends "tracker/base.html" %}
{% block title %}Data - Roamly{% endblock %}

{% block content %}
<div class="container">
    <div class="page-header" style="display: flex; justify-content: space-between; align-items: center;">
        <h1>Location Data</h1>
        <div style="display: flex; gap: 0.5rem; align-items: center;">
            <select id="data-device" class="form-control" style="width: auto;">
                <option value="">All devices</option>
                {% for device in devices %}
                <option value="{{ device.device_id }}">{{ device.name|default:device.device_id }}</option>
                {% endfor %}
            </select>
            <input id="data-q" placeholder="Search town/state/country" class="form-control" style="width: 18rem;" />
            <input id="data-min-speed" placeholder="Min speed (m/s)" class="form-control" style="width: 8rem;" />
            <input id="data-max-speed" placeholder="Max speed (m/s)" class="form-control" style="width: 8rem;" />
            <select id="data-range" class="form-control" style="width: auto;">
                <option value="24">Last 24h</option>
                <option value="72">Last 3 days</option>
                <option value="168">Last week</option>
                <option value="720">Last 30 days</option>
                <option value="all">All time</option>
            </select>
            <button class="btn btn-primary btn-sm" onclick="loadData()">Load</button>
        </div>
    </div>

    <div class="card">
        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th class="sortable" data-key="device" onclick="sortBy('device')">Device <span class="sort-arrow"></span></th>
                        <th class="sortable" data-key="lat" onclick="sortBy('lat')">Latitude <span class="sort-arrow"></span></th>
                        <th class="sortable" data-key="lng" onclick="sortBy('lng')">Longitude <span class="sort-arrow"></span></th>
                        <th class="sortable" data-key="city" onclick="sortBy('city')">City <span class="sort-arrow"></span></th>
                        <th class="sortable" data-key="state" onclick="sortBy('state')">State <span class="sort-arrow"></span></th>
                        <th class="sortable" data-key="country_code" onclick="sortBy('country_code')">Country <span class="sort-arrow"></span></th>
                        <th class="sortable" data-key="speed" onclick="sortBy('speed')">Speed <span class="sort-arrow"></span></th>
                        <th class="sortable" data-key="battery" onclick="sortBy('battery')">Battery <span class="sort-arrow"></span></th>
                        <th class="sortable active-sort" data-key="timestamp" onclick="sortBy('timestamp')">Timestamp <span class="sort-arrow">&#9660;</span></th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="data-table-body">
                    <tr><td colspan="10" style="text-align: center; color: var(--text-muted); padding: 2rem;">
                        <span class="spinner"></span> Loading...
                    </td></tr>
                </tbody>
            </table>
        </div>
        <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 0.75rem; gap:0.5rem;">
            <div id="data-info" style="font-size: 0.8125rem; color: var(--text-muted);"></div>
            <div style="display:flex; gap:0.5rem;">
                <button id="load-more-btn" class="btn btn-outline btn-sm" onclick="loadMore()" style="display: none;">Load More</button>
                <button id="load-all-btn" class="btn btn-outline btn-sm" onclick="loadAll()" style="display: none;">Load All</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_css %}
<style>
    th.sortable { cursor: pointer; user-select: none; white-space: nowrap; }
    th.sortable:hover { color: var(--primary); }
    th.sortable .sort-arrow { font-size: 0.7em; opacity: 0.3; }
    th.sortable.active-sort .sort-arrow { opacity: 1; }
</style>
{% endblock %}

{% block extra_js %}
<script>
let currentOffset = 0;
let lastBeforeValue = null;
let lastBeforeId = null;
const LIMIT = 1000;
const API_MAX_LIMIT = 50000; // server-side max
let allRows = [];
let sortKey = 'timestamp';
let sortDir = 'desc';

function formatSpeed(speedMs) {
    const unit = localStorage.getItem('roamly_speed_unit') || 'kmh';
    if (unit === 'mph') return (speedMs * 2.23694).toFixed(1) + ' mi/h';
    return (speedMs * 3.6).toFixed(1) + ' km/h';
}

function renderRows() {
    const html = allRows.map(r => `<tr id="loc-${r.id}">
        <td>${r.device}</td>
        <td>${r.lat.toFixed(5)}</td>
        <td>${r.lng.toFixed(5)}</td>
        <td>${r.city || '-'}</td>
        <td>${r.state || '-'}</td>
        <td>${r.country_code || '-'}</td>
        <td>${r.speed !== null && r.speed !== undefined ? formatSpeed(r.speed) : '-'}</td>
        <td>${r.battery !== null && r.battery !== undefined ? r.battery + '%' : '-'}</td>
        <td style="color:var(--text-muted)">${new Date(r.timestamp).toLocaleString()}</td>
        <td><button onclick="deleteLocation(${r.id})" class="btn-icon" title="Delete point" style="color:var(--text-muted);cursor:pointer;background:none;border:none;padding:0.25rem;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
        </button></td>
    </tr>`).join('');

    document.getElementById('data-table-body').innerHTML = html ||
        '<tr><td colspan="10" style="text-align:center;color:var(--text-muted);">No data</td></tr>';

    // Update sort arrows
    document.querySelectorAll('th.sortable').forEach(th => {
        const arrow = th.querySelector('.sort-arrow');
        if (th.dataset.key === sortKey) {
            th.classList.add('active-sort');
            arrow.innerHTML = sortDir === 'asc' ? '&#9650;' : '&#9660;';
        } else {
            th.classList.remove('active-sort');
            arrow.innerHTML = '';
        }
    });
}

function sortBy(key) {
    if (sortKey === key) {
        sortDir = sortDir === 'asc' ? 'desc' : 'asc';
    } else {
        sortKey = key;
        sortDir = ['timestamp', 'speed', 'battery'].includes(key) ? 'desc' : 'asc';
    }
    loadData(false);
}

function buildParams(append = false, limit = LIMIT) {
    const device = document.getElementById('data-device').value;
    const range = document.getElementById('data-range').value;
    const qVal = document.getElementById('data-q').value.trim();
    const minSpeedVal = document.getElementById('data-min-speed').value.trim();
    const maxSpeedVal = document.getElementById('data-max-speed').value.trim();
    const params = new URLSearchParams({
        limit: String(limit),
        sort_key: sortKey,
        sort_dir: sortDir,
    });

    if (!append) {
        currentOffset = 0;
        allRows = [];
        lastBeforeValue = null;
        lastBeforeId = null;
    }

    if (append && lastBeforeValue !== null && lastBeforeValue !== undefined) {
        params.set('before_value', String(lastBeforeValue));
        if (lastBeforeId !== null && lastBeforeId !== undefined) params.set('before_id', String(lastBeforeId));
    } else {
        params.set('offset', String(currentOffset));
    }

    if (qVal || minSpeedVal || maxSpeedVal) {
        params.set('all', '1');
        if (qVal) params.set('q', qVal);
        if (minSpeedVal) params.set('min_speed', minSpeedVal);
        if (maxSpeedVal) params.set('max_speed', maxSpeedVal);
    } else if (range === 'all') {
        params.set('all', '1');
    } else {
        params.set('hours', range);
    }
    if (device) params.set('device_id', device);
    return params;
}

function loadData(append = false) {
    const params = buildParams(append, LIMIT);

    if (!append) {
        document.getElementById('data-table-body').innerHTML =
            '<tr><td colspan="10" style="text-align:center;color:var(--text-muted);padding:2rem;"><span class="spinner"></span> Loading...</td></tr>';
    }

    const loadMoreBtn = document.getElementById('load-more-btn');
    loadMoreBtn.disabled = true;
    loadMoreBtn.innerHTML = '<span class="spinner"></span> Loading...';

    fetch(`/api/locations/?${params}`)
        .then(r => {
            if (!r.ok) {
                return r.json().then(body => {
                    const err = new Error(`HTTP ${r.status}`);
                    err._serverMsg = body.error ? `${body.type}: ${body.error}` : `HTTP ${r.status}`;
                    throw err;
                }).catch(() => { throw new Error(`HTTP ${r.status}`); });
            }
            return r.json();
        })
        .then(data => {
            const rows = Array.isArray(data.locations) ? data.locations : [];
            const grouped = Array.isArray(data.devices) ? data.devices : [];
            if (!rows.length && !grouped.length) {
                console.warn('locations API returned empty payload or unexpected format', data);
                // show no-data state and hide pagination
                allRows = allRows || [];
                renderRows();
                document.getElementById('data-info').textContent = `Showing ${allRows.length} location points`;
                loadMoreBtn.style.display = 'none';
                document.getElementById('load-all-btn').style.display = 'none';
                return;
            }
            let count = 0;
            if (rows.length) {
                rows.forEach(loc => {
                    count++;
                    allRows.push({
                        id: loc.id,
                        device: loc.device,
                        lat: loc.lat,
                        lng: loc.lng,
                        city: loc.city,
                        state: loc.state,
                        country_code: loc.country_code,
                        speed: loc.speed,
                        battery: loc.battery,
                        timestamp: loc.timestamp,
                    });
                });
            } else {
                grouped.forEach(dev => {
                    if (!dev.locations) return;
                    dev.locations.forEach(loc => {
                        count++;
                        allRows.push({
                            id: loc.id,
                            device: dev.name,
                            lat: loc.lat,
                            lng: loc.lng,
                            city: loc.city,
                            state: loc.state,
                            country_code: loc.country_code,
                            speed: loc.speed,
                            battery: loc.battery,
                            timestamp: loc.timestamp,
                        });
                    });
                });
            }

            currentOffset += count;
            // update keyset cursor if server provided
            if (data.next_before_value !== undefined) {
                lastBeforeValue = data.next_before_value;
                lastBeforeId = data.next_before_id ?? null;
            }
            renderRows();
            document.getElementById('data-info').textContent = `Showing ${allRows.length} location points`;

            if (data.has_more) {
                loadMoreBtn.style.display = 'block';
                loadMoreBtn.disabled = false;
                loadMoreBtn.textContent = 'Load More';
                // show option to load everything (may take a long time)
                const loadAllBtn = document.getElementById('load-all-btn');
                loadAllBtn.style.display = 'block';
                loadAllBtn.disabled = false;
            } else {
                loadMoreBtn.style.display = 'none';
                document.getElementById('load-all-btn').style.display = 'none';
            }
        })
        .catch(err => {
            console.error('Failed to load data:', err);
            document.getElementById('data-table-body').innerHTML =
                `<tr><td colspan="10" style="text-align:center;color:var(--danger);padding:2rem;">Error loading data: ${err._serverMsg || err.message}. Check the server logs for details.</td></tr>`;
            document.getElementById('data-info').textContent = '';
            loadMoreBtn.disabled = false;
            loadMoreBtn.textContent = 'Retry';
            loadMoreBtn.style.display = 'block';
            loadMoreBtn.onclick = () => loadData(false);
        });
}

function loadMore() {
    loadData(true);
}

async function loadAll() {
    const loadAllBtn = document.getElementById('load-all-btn');
    const loadMoreBtn = document.getElementById('load-more-btn');

    loadAllBtn.disabled = true;
    loadMoreBtn.disabled = true;
    loadAllBtn.innerHTML = '<span class="spinner"></span> Loading all...';

    try {
        let iteration = 0;
        while (true) {
            iteration++;
            // keep cursor fresh for each iteration
            const iterParams = buildParams(true, API_MAX_LIMIT);

            // show incremental progress for very large loads
            document.getElementById('data-info').textContent = `Loading batch ${iteration}... (loaded ${allRows.length})`;

            const resp = await fetch(`/api/locations/?${iterParams}`);
            if (!resp.ok) {
                const body = await resp.json().catch(() => ({}));
                throw new Error(body.error ? `${body.type}: ${body.error}` : `HTTP ${resp.status}`);
            }
            const data = await resp.json();
            const rows = Array.isArray(data.locations) ? data.locations : [];
            const grouped = Array.isArray(data.devices) ? data.devices : [];
            if (!rows.length && !grouped.length) {
                console.warn('locations API returned empty payload or unexpected format', data);
                renderRows();
                document.getElementById('data-info').textContent = `Showing ${allRows.length} location points`;
                break;
            }

            let count = 0;
            if (rows.length) {
                rows.forEach(loc => {
                    count++;
                    allRows.push({
                        id: loc.id,
                        device: loc.device,
                        lat: loc.lat,
                        lng: loc.lng,
                        city: loc.city,
                        state: loc.state,
                        country_code: loc.country_code,
                        speed: loc.speed,
                        battery: loc.battery,
                        timestamp: loc.timestamp,
                    });
                });
            } else {
                grouped.forEach(dev => {
                    if (!dev.locations) return;
                    dev.locations.forEach(loc => {
                        count++;
                        allRows.push({
                            id: loc.id,
                            device: dev.name,
                            lat: loc.lat,
                            lng: loc.lng,
                            city: loc.city,
                            state: loc.state,
                            country_code: loc.country_code,
                            speed: loc.speed,
                            battery: loc.battery,
                            timestamp: loc.timestamp,
                        });
                    });
                });
            }

            currentOffset += count;
            renderRows();
            document.getElementById('data-info').textContent = `Showing ${allRows.length} location points`;

            // update cursor from server
            if (data.next_before_value !== undefined) {
                lastBeforeValue = data.next_before_value;
                lastBeforeId = data.next_before_id ?? null;
                if (!data.has_more) break;
            } else if (!data.has_more) {
                break;
            }
            // allow the UI to update between large batches
            await new Promise(r => setTimeout(r, 100));
        }
    } catch (err) {
        console.error('Failed to load all data:', err);
        document.getElementById('data-info').textContent = `Error: ${err.message}`;
    } finally {
        loadAllBtn.disabled = false;
        loadAllBtn.textContent = 'Load All';
        loadMoreBtn.disabled = false;
        // hide Load More once all loaded
        document.getElementById('load-more-btn').style.display = 'none';
        document.getElementById('load-all-btn').style.display = 'none';
    }
}

function deleteLocation(id) {
    if (!confirm('Delete this location point?')) return;
    fetch(`/api/locations/${id}/delete/`, {
        method: 'DELETE',
        headers: {'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]')?.value || '{{ csrf_token }}'}
    }).then(r => {
        if (r.ok) {
            allRows = allRows.filter(r => r.id !== id);
            renderRows();
            document.getElementById('data-info').textContent = `Showing ${allRows.length} location points`;
        }
    });
}

loadData();
document.getElementById('data-device').addEventListener('change', () => loadData(false));
document.getElementById('data-range').addEventListener('change', () => loadData(false));
document.getElementById('data-q').addEventListener('input', () => {
    // debounce
    clearTimeout(window._dataQTimer);
    window._dataQTimer = setTimeout(() => loadData(false), 350);
});
document.getElementById('data-min-speed').addEventListener('change', () => loadData(false));
document.getElementById('data-max-speed').addEventListener('change', () => loadData(false));

// Infinite scroll: load more when near bottom of table container or window
function _checkAndMaybeLoadMore(elTop, elHeight, elScrollTop, elScrollHeight) {
    if (elScrollTop + elHeight >= elScrollHeight - 180) {
        const loadMoreBtn = document.getElementById('load-more-btn');
        if (loadMoreBtn && loadMoreBtn.style.display !== 'none' && !loadMoreBtn.disabled) {
            loadMore();
        }
    }
}

let _scrollPending = false;
const tableContainer = document.querySelector('.table-responsive');

function _onScrollEvent(source) {
    if (_scrollPending) return;
    _scrollPending = true;
    requestAnimationFrame(() => {
        try {
            if (source === 'window') {
                const scrollTop = window.scrollY || window.pageYOffset || document.documentElement.scrollTop;
                const height = window.innerHeight || document.documentElement.clientHeight;
                const scrollHeight = document.documentElement.scrollHeight;
                _checkAndMaybeLoadMore(0, height, scrollTop, scrollHeight);
            } else if (tableContainer) {
                _checkAndMaybeLoadMore(tableContainer.getBoundingClientRect().top, tableContainer.clientHeight, tableContainer.scrollTop, tableContainer.scrollHeight);
            }
        } finally {
            _scrollPending = false;
        }
    });
}

if (tableContainer) tableContainer.addEventListener('scroll', () => _onScrollEvent('container'));
window.addEventListener('scroll', () => _onScrollEvent('window'));
</script>
{% endblock %}
