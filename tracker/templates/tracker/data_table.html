{% extends "tracker/base.html" %}
{% block title %}Data - Roamly{% endblock %}

{% block content %}
<div class="container">
    <div class="page-header" style="display: flex; justify-content: space-between; align-items: center;">
        <h1>Location Data</h1>
        <div style="display: flex; gap: 0.5rem; align-items: center;">
            <select id="data-device" class="form-control" style="width: auto;">
                <option value="">All devices</option>
                {% for device in devices %}
                <option value="{{ device.device_id }}">{{ device.name|default:device.device_id }}</option>
                {% endfor %}
            </select>
            <select id="data-range" class="form-control" style="width: auto;">
                <option value="24">Last 24h</option>
                <option value="72">Last 3 days</option>
                <option value="168">Last week</option>
                <option value="720">Last 30 days</option>
                <option value="all">All time</option>
            </select>
            <button class="btn btn-primary btn-sm" onclick="loadData()">Load</button>
        </div>
    </div>

    <div class="card">
        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>Device</th>
                        <th>Latitude</th>
                        <th>Longitude</th>
                        <th>City</th>
                        <th>State</th>
                        <th>Country</th>
                        <th>Speed</th>
                        <th>Battery</th>
                        <th>Timestamp</th>
                    </tr>
                </thead>
                <tbody id="data-table-body">
                    <tr><td colspan="9" style="text-align: center; color: var(--text-muted); padding: 2rem;">
                        <span class="spinner"></span> Loading...
                    </td></tr>
                </tbody>
            </table>
        </div>
        <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 0.75rem;">
            <div id="data-info" style="font-size: 0.8125rem; color: var(--text-muted);"></div>
            <button id="load-more-btn" class="btn btn-outline btn-sm" onclick="loadMore()" style="display: none;">Load More</button>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
let currentOffset = 0;
let totalLoaded = 0;
const LIMIT = 1000;

function formatSpeed(speedMs) {
    const unit = localStorage.getItem('roamly_speed_unit') || 'kmh';
    if (unit === 'mph') return (speedMs * 2.23694).toFixed(1) + ' mi/h';
    return (speedMs * 3.6).toFixed(1) + ' km/h';
}

function loadData(append = false) {
    const device = document.getElementById('data-device').value;
    const range = document.getElementById('data-range').value;
    const params = new URLSearchParams({ limit: LIMIT });

    if (!append) {
        currentOffset = 0;
        totalLoaded = 0;
    }
    
    params.set('offset', currentOffset);

    if (range === 'all') {
        params.set('all', '1');
    } else {
        params.set('hours', range);
    }
    if (device) params.set('device_id', device);

    if (!append) {
        document.getElementById('data-table-body').innerHTML =
            '<tr><td colspan="9" style="text-align:center;color:var(--text-muted);padding:2rem;"><span class="spinner"></span> Loading...</td></tr>';
    }
    
    const loadMoreBtn = document.getElementById('load-more-btn');
    loadMoreBtn.disabled = true;
    loadMoreBtn.innerHTML = '<span class="spinner"></span> Loading...';

    fetch(`/api/locations/?${params}`)
        .then(r => r.json())
        .then(data => {
            let rows = [];
            let count = 0;
            data.devices.forEach(dev => {
                dev.locations.forEach(loc => {
                    count++;
                    const ts = new Date(loc.timestamp);
                    rows.push(`<tr>
                        <td>${dev.name}</td>
                        <td>${loc.lat.toFixed(5)}</td>
                        <td>${loc.lng.toFixed(5)}</td>
                        <td>${loc.city || '-'}</td>
                        <td>${loc.state || '-'}</td>
                        <td>${loc.country_code || '-'}</td>
                        <td>${loc.speed ? formatSpeed(loc.speed) : '-'}</td>
                        <td>${loc.battery ? loc.battery + '%' : '-'}</td>
                        <td style="color:var(--text-muted)">${ts.toLocaleString()}</td>
                    </tr>`);
                });
            });

            if (append) {
                const tbody = document.getElementById('data-table-body');
                tbody.insertAdjacentHTML('beforeend', rows.join(''));
            } else {
                document.getElementById('data-table-body').innerHTML = rows.join('') ||
                    '<tr><td colspan="9" style="text-align:center;color:var(--text-muted);">No data</td></tr>';
            }
            
            totalLoaded += count;
            currentOffset += count;
            
            document.getElementById('data-info').textContent = `Showing ${totalLoaded} location points`;
            
            // Show/hide load more button
            if (count >= LIMIT) {
                loadMoreBtn.style.display = 'block';
                loadMoreBtn.disabled = false;
                loadMoreBtn.textContent = 'Load More';
            } else {
                loadMoreBtn.style.display = 'none';
            }
        });
}

function loadMore() {
    loadData(true);
}

loadData();
document.getElementById('data-device').addEventListener('change', () => loadData(false));
document.getElementById('data-range').addEventListener('change', () => loadData(false));
</script>
{% endblock %}
