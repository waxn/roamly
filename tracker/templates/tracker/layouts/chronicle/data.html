{% extends "tracker/data_table.html" %}
{% comment %} Chronicle's Raw data: the classic tables (same ids, sorting, load-more, recap reader)
   flattened to hairline rows with a sticky header inside a viewport-high scroller. The parent's
   own extra_css is reproduced below (minus its stray <style> wrapper) rather than inherited, so
   the recap reader keeps working. {% endcomment %}

{% block extra_css %}
/* ══ Chronicle flat page grammar: no card plates, hairlines, serif titles, mono figures.
   Every rule hangs off main#main-content so it outranks the component skins (.card, .btn, th...). ══ */
html[data-layout="chronicle"] main#main-content .container { max-width: 1040px; padding: 32px 24px 64px; }
html[data-layout="chronicle"] main#main-content .page-header, html[data-layout="chronicle"] main#main-content .page-toolbar {
    display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between;
    gap: 12px 24px; margin: 0 0 24px; padding: 0 0 16px; border-bottom: 1px solid var(--border);
}
html[data-layout="chronicle"] main#main-content .page-header h1, html[data-layout="chronicle"] main#main-content .page-toolbar h1 {
    margin: 0; font-family: var(--font-display); font-size: 34px; line-height: 1.1; font-weight: 500;
    letter-spacing: -0.015em; color: var(--text);
}
html[data-layout="chronicle"] main#main-content .toolbar-actions { gap: 8px; }

/* Cards lose their plate. Content is separated by hairlines, not boxes. */
html[data-layout="chronicle"] main#main-content .card, html[data-layout="chronicle"] main#main-content .card:hover {
    background: transparent; border: 0; border-radius: 0; box-shadow: none; backdrop-filter: none;
    color: var(--text); padding: 0; margin-bottom: 0; transform: none; filter: none;
}
html[data-layout="chronicle"] main#main-content .card::before, html[data-layout="chronicle"] main#main-content .card::after { display: none; }
/* Skins that turn stat cards into stacked tiles (bento) must not reorder or size them. */
html[data-layout="chronicle"] main#main-content .card.stat-card { display: block; min-height: 0; text-align: left; }
html[data-layout="chronicle"] main#main-content .card.stat-card .stat-label { order: 0; margin: 8px 0 0; color: var(--text-muted); }
html[data-layout="chronicle"] main#main-content .card .stat-label { color: var(--text-muted); }
html[data-layout="chronicle"] main#main-content .card-header {
    display: block; width: auto; border-radius: 0; box-shadow: none;
    margin: 0 0 12px; padding: 0 0 8px; border: 0; border-bottom: 1px solid var(--border); background: none;
    font-family: var(--font-display); font-size: 20px; line-height: 1.25; font-weight: 500;
    letter-spacing: 0; text-transform: none; color: var(--text);
}
html[data-layout="chronicle"] main#main-content .card-header::before, html[data-layout="chronicle"] main#main-content .card-header::after { display: none; }
html[data-layout="chronicle"] main#main-content .table-responsive { border: 0; border-radius: 0; background: none; box-shadow: none; }

/* Quiet controls */
html[data-layout="chronicle"] main#main-content .btn {
    min-height: 34px; padding: 0 14px; justify-content: center;
    border-radius: var(--r-2, 0px); box-shadow: none; text-shadow: none;
    font-family: var(--font-body); font-size: 13px; font-weight: 500; letter-spacing: 0; text-transform: none;
}
html[data-layout="chronicle"] main#main-content .btn-sm { min-height: 32px; padding: 0 12px; }
html[data-layout="chronicle"] main#main-content .btn-outline { background: transparent; border: 1px solid var(--border-strong); color: var(--text); }
html[data-layout="chronicle"] main#main-content .btn-outline:hover { background: var(--lx-ch-tint); border-color: var(--border-strong); color: var(--text); }
html[data-layout="chronicle"] main#main-content .btn-primary { background: var(--primary); border: 1px solid var(--primary); color: var(--on-primary, #fff); }
html[data-layout="chronicle"] main#main-content .btn-primary:hover { background: var(--primary-hover); border-color: var(--primary-hover); }
html[data-layout="chronicle"] main#main-content .btn:focus-visible, html[data-layout="chronicle"] main#main-content .tab-btn:focus-visible, html[data-layout="chronicle"] main#main-content th.sortable:focus-visible { outline: 2px solid var(--lx-ch-ring); outline-offset: 2px; }
html[data-layout="chronicle"] main#main-content .toolbar-actions .form-control, html[data-layout="chronicle"] main#main-content .toolbar-actions select, html[data-layout="chronicle"] main#main-content .toolbar-actions input[type="date"],
html[data-layout="chronicle"] main#main-content .toolbar-actions .rly-select-trigger, html[data-layout="chronicle"] main#main-content .toolbar-actions .rly-date-trigger {
    box-sizing: border-box; height: 34px; min-height: 34px; padding: 0 10px; width: auto;
    background: transparent; border: 1px solid var(--border); border-radius: var(--r-2, 0px); box-shadow: none;
    color: var(--text); font-family: var(--font-body); font-size: 13px;
}
html[data-layout="chronicle"] main#main-content .toolbar-actions input[type="date"] { font-family: var(--font-mono); font-variant-numeric: tabular-nums; color-scheme: dark; }
html[data-layout="chronicle"][data-theme="light"] main#main-content .toolbar-actions input[type="date"] { color-scheme: light; }
html[data-layout="chronicle"] main#main-content .toolbar-actions .form-control:hover, html[data-layout="chronicle"] main#main-content .toolbar-actions select:hover, html[data-layout="chronicle"] main#main-content .toolbar-actions input[type="date"]:hover,
html[data-layout="chronicle"] main#main-content .toolbar-actions .rly-select-trigger:hover, html[data-layout="chronicle"] main#main-content .toolbar-actions .rly-date-trigger:hover { border-color: var(--border-strong); }

/* Tabs: an underline on a hairline, not a pill group */
html[data-layout="chronicle"] main#main-content .pill-tabs {
    display: flex; width: 100%; gap: 24px; margin: 0 0 24px; padding: 0;
    background: none; border: 0; border-bottom: 1px solid var(--border); border-radius: 0; box-shadow: none;
    overflow-x: auto; overflow-y: hidden; scrollbar-width: none;
}
html[data-layout="chronicle"] main#main-content .pill-tabs::-webkit-scrollbar { display: none; }
html[data-layout="chronicle"] main#main-content .pill-tabs .tab-btn, html[data-layout="chronicle"] main#main-content .pill-tabs button.tab-btn {
    position: relative; flex: none; min-height: 40px; margin: 0 0 -1px; padding: 0 0 2px;
    background: none; border: 0; border-bottom: 2px solid transparent; border-radius: 0;
    font-family: var(--font-body); font-size: 14px; font-weight: 500; letter-spacing: 0; text-transform: none;
    color: var(--text-muted); cursor: pointer; transition: color 120ms ease-out, border-color 120ms ease-out;
}
html[data-layout="chronicle"] main#main-content .pill-tabs .tab-btn:hover { background: none; color: var(--text); }
html[data-layout="chronicle"] main#main-content .pill-tabs .tab-btn.active, html[data-layout="chronicle"][data-theme="light"] main#main-content .pill-tabs .tab-btn.active {
    background: none; color: var(--text); border-bottom-color: var(--primary);
}

/* Tables: hairline rows, sticky header, tabular numerals */
html[data-layout="chronicle"] main#main-content table { font-size: 14px; font-variant-numeric: tabular-nums; }
html[data-layout="chronicle"] main#main-content th, html[data-layout="chronicle"] main#main-content td { padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
html[data-layout="chronicle"] main#main-content th:first-child, html[data-layout="chronicle"] main#main-content td:first-child { padding-left: 0; }
html[data-layout="chronicle"] main#main-content th:last-child, html[data-layout="chronicle"] main#main-content td:last-child { padding-right: 0; }
html[data-layout="chronicle"] main#main-content th {
    position: sticky; top: 0; z-index: 2; background: var(--bg);
    border-bottom: 1px solid var(--border-strong);
    font-family: var(--font-body); font-size: 12px; font-weight: 500; letter-spacing: 0; text-transform: none;
    color: var(--text-muted); white-space: nowrap;
}
html[data-layout="chronicle"] main#main-content th.sortable:hover, html[data-layout="chronicle"] main#main-content th.sortable.active-sort { color: var(--text); }
html[data-layout="chronicle"] main#main-content th.sortable.active-sort .sort-arrow { color: var(--primary); }
html[data-layout="chronicle"] main#main-content thead tr:hover { background: none; }
html[data-layout="chronicle"] main#main-content tbody tr:hover { background: var(--lx-ch-tint); }
html[data-layout="chronicle"] main#main-content tbody tr:hover td { background: transparent; }
html[data-layout="chronicle"] main#main-content tbody tr:last-child td { border-bottom: 0; }
html[data-layout="chronicle"] main#main-content td code { font-family: var(--font-mono); font-size: 12px; background: none; padding: 0; color: var(--text-muted); }

@media (max-width: 768px) {
    html[data-layout="chronicle"] main#main-content .container { padding: 20px 16px 48px; }
    html[data-layout="chronicle"] main#main-content .page-header h1, html[data-layout="chronicle"] main#main-content .page-toolbar h1 { font-size: 28px; }
    html[data-layout="chronicle"] main#main-content .btn, html[data-layout="chronicle"] main#main-content .btn-sm { min-height: 44px; }
    html[data-layout="chronicle"] main#main-content .toolbar-actions .form-control, html[data-layout="chronicle"] main#main-content .toolbar-actions select, html[data-layout="chronicle"] main#main-content .toolbar-actions input[type="date"],
    html[data-layout="chronicle"] main#main-content .toolbar-actions .rly-select-trigger, html[data-layout="chronicle"] main#main-content .toolbar-actions .rly-date-trigger { height: 44px; min-height: 44px; }
    html[data-layout="chronicle"] main#main-content .pill-tabs .tab-btn, html[data-layout="chronicle"] main#main-content .pill-tabs button.tab-btn { min-height: 44px; }
}


/* ── Raw data ─────────────────────────────────────────────────────── */
html[data-layout="chronicle"] main#main-content .container { max-width: 1280px; }
html[data-layout="chronicle"] main#main-content .toolbar-actions .btn-sm { padding: 0 14px; }
html[data-layout="chronicle"] main#main-content #loc-card, html[data-layout="chronicle"] main#main-content #raw-card { margin: 0; }
html[data-layout="chronicle"] main#main-content #loc-card .table-responsive, html[data-layout="chronicle"] main#main-content #raw-scroll {
    max-height: calc(100dvh - var(--nav-h) - 230px); min-height: 280px; overflow: auto; overscroll-behavior: contain;
}
html[data-layout="chronicle"] main#main-content #loc-card[hidden], html[data-layout="chronicle"] main#main-content #raw-card[hidden] { display: none; }
html[data-layout="chronicle"] main#main-content table { table-layout: auto; min-width: 100%; }
html[data-layout="chronicle"] main#main-content td { white-space: nowrap; font-size: 13px; }
html[data-layout="chronicle"] main#main-content td:first-child { font-size: 14px; }
/* Recorded points: figures in mono, right-aligned. Device, city, state, country, place stay left. */
html[data-layout="chronicle"] main#main-content #loc-card :is(th, td):is(:nth-child(2), :nth-child(3), :nth-child(8), :nth-child(9)) { text-align: right; }
html[data-layout="chronicle"] main#main-content #loc-card td:is(:nth-child(2), :nth-child(3), :nth-child(8), :nth-child(9), :nth-child(10)) { font-family: var(--font-mono); font-size: 12.5px; }
html[data-layout="chronicle"] main#main-content #data-table-body tr[id^="loc-"] { cursor: pointer; }
html[data-layout="chronicle"] main#main-content #data-table-body td .btn-icon { min-width: 32px; min-height: 32px; display: inline-flex; align-items: center; justify-content: center; border-radius: var(--r-2, 0px); }
html[data-layout="chronicle"] main#main-content #data-table-body td .btn-icon:hover { color: var(--danger); background: var(--lx-ch-tint); }
html[data-layout="chronicle"] main#main-content #data-info, html[data-layout="chronicle"] main#main-content #raw-info { font-family: var(--font-mono); font-size: 12px; font-variant-numeric: tabular-nums; }
html[data-layout="chronicle"] main#main-content #raw-body tr.raw-open { cursor: pointer; }
html[data-layout="chronicle"] main#main-content #raw-body tr.raw-open:hover td, html[data-layout="chronicle"] main#main-content #raw-body tr.raw-open:focus-visible td { background: var(--lx-ch-tint); }
html[data-layout="chronicle"] main#main-content #raw-body tr.raw-open:focus-visible { outline: 2px solid var(--lx-ch-ring); outline-offset: -2px; }

/* Recap email reader (a dialog, so it keeps a surface). */
.recap-overlay {
    position: fixed; inset: 0; z-index: 9000; display: flex;
    align-items: center; justify-content: center;
    padding: 1rem; background: rgba(0, 0, 0, 0.6);
}
.recap-overlay[hidden] { display: none; }
.recap-panel {
    width: 100%; max-width: 640px; max-height: calc(100vh - 2rem);
    display: flex; flex-direction: column; gap: 0.75rem;
    background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--r-4, 0px);
    padding: 1.25rem; box-shadow: var(--clay-shadow-hover);
}
.recap-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 0.75rem; }
.recap-subject { margin: 0; font-family: var(--font-display); font-size: 1.1rem; overflow-wrap: anywhere; }
.recap-meta { margin-top: 0.25rem; font-size: 0.8125rem; color: var(--text-muted); }
.recap-tabs { display: flex; gap: 0.5rem; }
.recap-tabs[hidden] { display: none; }
.recap-tabs [aria-pressed="true"] { border-color: var(--primary); color: var(--primary); }
.recap-frame { width: 100%; height: 65vh; min-height: 0; flex: 0 1 auto; border: 1px solid var(--border); background: #14160f; }
.recap-text {
    margin: 0; height: 65vh; min-height: 0; flex: 0 1 auto; overflow: auto; padding: 0.75rem;
    border: 1px solid var(--border); background: var(--bg-elevated);
    font-size: 0.8125rem; white-space: pre-wrap; overflow-wrap: anywhere;
}
.recap-text.is-prose { height: auto; max-height: 50vh; font-family: inherit; font-size: 0.95rem; line-height: 1.55; }

@media (max-width: 768px) {
    html[data-layout="chronicle"] main#main-content #loc-card .table-responsive, html[data-layout="chronicle"] main#main-content #raw-scroll { max-height: calc(100dvh - var(--bottom-nav-height) - 150px); }
    html[data-layout="chronicle"] main#main-content th, html[data-layout="chronicle"] main#main-content td { padding: 12px 10px; }
    html[data-layout="chronicle"] main#main-content #data-table-body td .btn-icon { min-width: 44px; min-height: 44px; }
    html[data-layout="chronicle"] main#main-content .toolbar-actions { width: 100%; }
    html[data-layout="chronicle"] main#main-content .toolbar-actions .rly-select, html[data-layout="chronicle"] main#main-content .toolbar-actions > select { flex: 1 1 140px; min-width: 0; }
}
{% endblock %}
