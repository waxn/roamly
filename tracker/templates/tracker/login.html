<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Roamly</title>
    {% load static %}
    <link rel="icon" type="image/x-icon" href="{% static 'tracker/roamlymark.ico' %}">
    <link rel="manifest" href="{% static 'tracker/manifest.json' %}">
    <meta name="theme-color" content="#0c1220">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0c1220;
            --bg-card: #141d30;
            --bg-elevated: #1a2540;
            --bg-input: #1e2d48;
            --border: rgba(255, 255, 255, 0.07);
            --border-bright: rgba(13, 191, 172, 0.5);
            --text: #e2e8f4;
            --text-muted: #8a96b0;
            --text-dim: #4a5568;
            --primary: #0DBFAC;
            --primary-soft: rgba(13, 191, 172, 0.12);
            --primary-hover: #0aa898;
            --danger: #ef4444;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Nunito', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-transform: lowercase;
            overflow: hidden;
        }

        /* blob bg */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 60% 50% at 15% -10%, rgba(13, 191, 172, 0.14), transparent 55%),
                radial-gradient(ellipse 50% 40% at 90% 10%, rgba(155, 142, 247, 0.08), transparent 50%),
                radial-gradient(circle at 50% 100%, rgba(91, 164, 229, 0.06), transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            opacity: 0.65;
            pointer-events: none;
        }

        .back-link {
            position: fixed;
            top: 1.25rem;
            left: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.45rem;
            color: var(--text-dim);
            text-decoration: none;
            font-size: 0.83rem;
            font-weight: 700;
            transition: color 0.15s, transform 0.2s;
            z-index: 10;
            padding: 0.4rem 0.8rem;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: 999px;
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.06),
                inset 0 -2px 0 rgba(0, 0, 0, 0.18),
                0 4px 12px rgba(0, 0, 0, 0.22);
        }
        .back-link:hover {
            color: var(--primary);
            transform: translateX(-2px);
        }
        .back-link svg {
            width: 14px;
            height: 14px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2.5;
            stroke-linecap: round;
        }

        .card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 400px;
            margin: 1rem;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 28px;
            padding: 2.5rem 2.25rem;
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.07),
                inset 0 -4px 0 rgba(0, 0, 0, 0.22),
                0 24px 64px rgba(0, 0, 0, 0.4),
                0 8px 20px rgba(0, 0, 0, 0.25);
        }

        .logo-wrap {
            text-align: center;
            margin-bottom: 0.6rem;
        }
        .logo-wrap img {
            height: 42px;
            filter: brightness(0) invert(1);
        }

        .card-subtitle {
            text-align: center;
            color: var(--text-dim);
            font-size: 0.83rem;
            font-weight: 600;
            margin-bottom: 2rem;
        }

        .alert-error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: #fca5a5;
            border-radius: 14px;
            padding: 0.75rem 1rem;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 1.25rem;
            line-height: 1.5;
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.04),
                inset 0 -2px 0 rgba(0, 0, 0, 0.15);
        }

        .form-group {
            margin-bottom: 1rem;
        }
        .form-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: 800;
            color: var(--text-muted);
            margin-bottom: 0.45rem;
            letter-spacing: 0.01em;
        }
        .form-control {
            width: 100%;
            padding: 0.65rem 0.95rem;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 14px;
            color: var(--text);
            font-family: 'Nunito', sans-serif;
            font-size: 0.9rem;
            font-weight: 600;
            outline: none;
            transition: border-color 0.15s, box-shadow 0.15s;
            box-shadow:
                inset 0 2px 6px rgba(0, 0, 0, 0.25),
                inset 0 1px 2px rgba(0, 0, 0, 0.15);
        }
        .form-control:focus {
            border-color: var(--border-bright);
            box-shadow:
                inset 0 2px 6px rgba(0, 0, 0, 0.2),
                inset 0 1px 2px rgba(0, 0, 0, 0.12),
                0 0 0 3px var(--primary-soft);
        }
        .form-control::placeholder { color: var(--text-dim); }

        .btn-submit {
            width: 100%;
            margin-top: 0.5rem;
            padding: 0.8rem;
            background: linear-gradient(135deg, #0DBFAC 0%, #0aa898 100%);
            color: #fff;
            border: none;
            border-radius: 14px;
            font-family: 'Nunito', sans-serif;
            font-size: 0.9rem;
            font-weight: 800;
            text-transform: lowercase;
            cursor: pointer;
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s;
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.2),
                inset 0 -3px 0 rgba(0, 0, 0, 0.2),
                0 8px 24px rgba(13, 191, 172, 0.35),
                0 3px 8px rgba(0, 0, 0, 0.2);
        }
        .btn-submit:hover {
            background: linear-gradient(135deg, #10d4bf 0%, #0DBFAC 100%);
            transform: scale(1.1);
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.25),
                inset 0 -4px 0 rgba(0, 0, 0, 0.18),
                0 18px 44px rgba(13, 191, 172, 0.5),
                0 6px 12px rgba(0, 0, 0, 0.22);
        }
        .btn-submit { transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.25s ease, background 0.2s; user-select: none; }
        @keyframes btn-pop {
            0%   { transform: scale(0.88); }
            50%  { transform: scale(1.14); }
            75%  { transform: scale(0.98); }
            100% { transform: scale(1); }
        }
        @keyframes clay-particle {
            0%   { transform: translate(0,0) scale(1.4); opacity: 1; }
            20%  { transform: translate(calc(var(--tx)*0.3), calc(var(--ty)*0.3)) scale(0.75); opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)) scale(0.05); opacity: 0; }
        }
        .btn-pressing { transform: scale(0.88) !important; transition: transform 0.07s ease !important; box-shadow: 0 2px 6px rgba(0,0,0,0.2) !important; }
        .btn-popping { animation: btn-pop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards !important; }

        .card-footer {
            margin-top: 1.5rem;
            text-align: center;
            color: var(--text-dim);
            font-size: 0.83rem;
            font-weight: 600;
        }
        .card-footer a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 800;
        }
        .card-footer a:hover { text-decoration: underline; }

        .divider {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin: 1.5rem 0;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }
        .divider-text {
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--text-dim);
        }
    </style>
</head>
<body>
    <canvas id="bg"></canvas>

    <a href="{% url 'tracker:landing' %}" class="back-link">
        <svg viewBox="0 0 24 24"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
        roamly
    </a>

    <div class="card">
        <div class="logo-wrap">
            <img src="{% static 'tracker/roamly.svg' %}" alt="Roamly">
        </div>
        <p class="card-subtitle">sign in to your account</p>

        {% if messages %}
            {% for message in messages %}
                <div class="alert-error">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label for="username">username</label>
                <input type="text" name="username" id="username" class="form-control" placeholder="your username" required autofocus>
            </div>
            <div class="form-group">
                <label for="password">password</label>
                <input type="password" name="password" id="password" class="form-control" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-submit">sign in →</button>
        </form>

        <div class="divider"><span class="divider-text">or</span></div>

        <div class="card-footer">
            no account? <a href="{% url 'tracker:signup' %}">sign up</a>
        </div>
    </div>

    <script>
        (function () {
            const canvas = document.getElementById('bg');
            const ctx = canvas.getContext('2d');
            const C = '13,191,172';
            let W, H, nodes, pings, trackers;

            function resize() {
                W = canvas.width = window.innerWidth;
                H = canvas.height = window.innerHeight;
                init();
            }

            function init() {
                const count = Math.max(14, Math.min(Math.floor(W * H / 25000), 36));
                nodes = Array.from({ length: count }, () => ({
                    x: Math.random() * W,
                    y: Math.random() * H,
                    size: Math.random() > 0.65 ? 2 : 1.3,
                    baseAlpha: 0.12 + Math.random() * 0.25
                }));
                pings = [];
                trackers = [makeTracker(), makeTracker()];
            }

            function makeTracker() {
                const a = nodes[Math.floor(Math.random() * nodes.length)];
                const b = nodes[Math.floor(Math.random() * nodes.length)];
                return { x: a.x, y: a.y, tx: b.x, ty: b.y, t: Math.random(), speed: 0.0005 + Math.random() * 0.0007, trail: [] };
            }

            function pingNode() {
                if (!nodes || !nodes.length) return;
                const n = nodes[Math.floor(Math.random() * nodes.length)];
                pings.push({ x: n.x, y: n.y, r: 0, alpha: 0.6 });
            }

            function draw() {
                ctx.clearRect(0, 0, W, H);

                for (let i = 0; i < nodes.length; i++) {
                    for (let j = i + 1; j < nodes.length; j++) {
                        const dx = nodes[i].x - nodes[j].x;
                        const dy = nodes[i].y - nodes[j].y;
                        const d = Math.sqrt(dx * dx + dy * dy);
                        if (d < 180) {
                            ctx.beginPath();
                            ctx.moveTo(nodes[i].x, nodes[i].y);
                            ctx.lineTo(nodes[j].x, nodes[j].y);
                            ctx.strokeStyle = `rgba(${C},${(1 - d / 180) * 0.07})`;
                            ctx.lineWidth = 0.7;
                            ctx.stroke();
                        }
                    }
                }

                trackers.forEach(tr => {
                    tr.t += tr.speed;
                    if (tr.t >= 1) {
                        tr.t = 0;
                        tr.x = tr.tx; tr.y = tr.ty;
                        const next = nodes[Math.floor(Math.random() * nodes.length)];
                        tr.tx = next.x; tr.ty = next.y;
                        tr.trail = [];
                        pings.push({ x: tr.x, y: tr.y, r: 0, alpha: 0.8 });
                    }
                    const cx = tr.x + (tr.tx - tr.x) * tr.t;
                    const cy = tr.y + (tr.ty - tr.y) * tr.t;
                    tr.trail.push({ x: cx, y: cy });
                    if (tr.trail.length > 45) tr.trail.shift();
                    tr.trail.forEach((pt, i) => {
                        ctx.beginPath();
                        ctx.arc(pt.x, pt.y, 1, 0, Math.PI * 2);
                        ctx.fillStyle = `rgba(${C},${(i / tr.trail.length) * 0.22})`;
                        ctx.fill();
                    });
                    ctx.beginPath();
                    ctx.arc(cx, cy, 3, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(${C},0.7)`;
                    ctx.fill();
                });

                nodes.forEach(n => {
                    ctx.beginPath();
                    ctx.arc(n.x, n.y, n.size, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(${C},${n.baseAlpha})`;
                    ctx.fill();
                });

                pings = pings.filter(p => p.alpha > 0.01);
                pings.forEach(p => {
                    p.r += 0.85;
                    p.alpha *= 0.958;
                    if (p.r < 52) {
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                        ctx.strokeStyle = `rgba(${C},${p.alpha * 0.4})`;
                        ctx.lineWidth = 1.1;
                        ctx.stroke();
                    }
                });

                requestAnimationFrame(draw);
            }

            resize();
            draw();
            setInterval(pingNode, 1600);
            window.addEventListener('resize', resize);
        })();

        // button inflate + pop + clay particles
        (function() {
            const COLORS = ['#0DBFAC','#FF6B6B','#9B8EF7','#F7B731','#5BA4E5','#22c55e'];
            function spawnParticles(btn) {
                const r = btn.getBoundingClientRect();
                const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
                for (let i = 0, n = 8 + Math.floor(Math.random() * 5); i < n; i++) {
                    const a = Math.random() * Math.PI * 2, d = 38 + Math.random() * 62;
                    const s = 5 + Math.random() * 9, c = COLORS[Math.floor(Math.random() * COLORS.length)];
                    const dur = (0.42 + Math.random() * 0.32).toFixed(2);
                    const el = document.createElement('span');
                    el.style.cssText = `position:fixed;left:${cx}px;top:${cy}px;width:${s}px;height:${s}px;margin:${(-s/2).toFixed(1)}px 0 0 ${(-s/2).toFixed(1)}px;border-radius:50%;background:${c};pointer-events:none;z-index:9999;box-shadow:0 2px 8px ${c}88;--tx:${(Math.cos(a)*d).toFixed(1)}px;--ty:${(Math.sin(a)*d).toFixed(1)}px;animation:clay-particle ${dur}s cubic-bezier(0.25,0.46,0.45,0.94) forwards`;
                    document.body.appendChild(el);
                    setTimeout(() => el.remove(), (+dur + 0.15) * 1000);
                }
            }
            document.querySelectorAll('.btn-submit').forEach(function(btn) {
                btn.addEventListener('pointerdown', function() { this.classList.remove('btn-popping'); this.classList.add('btn-pressing'); });
                function release() {
                    if (!this.classList.contains('btn-pressing')) return;
                    this.classList.remove('btn-pressing');
                    this.classList.add('btn-popping');
                    spawnParticles(this);
                    this.addEventListener('animationend', () => this.classList.remove('btn-popping'), { once: true });
                }
                btn.addEventListener('pointerup', release);
                btn.addEventListener('pointercancel', function() { this.classList.remove('btn-pressing'); });
                btn.addEventListener('pointerleave', function() { this.classList.remove('btn-pressing'); });
            });
        })();
    </script>
</body>
</html>
