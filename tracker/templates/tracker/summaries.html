{% extends 'tracker/base.html' %}
{% block title %}Summaries - Roamly{% endblock %}

{% block extra_css %}
<style>
.sum-wrap { max-width: 1150px; }

.sum-toolbar {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    margin-bottom: 1.25rem;
    flex-wrap: wrap;
}
.sum-toolbar h1 {
    font-family: var(--font-display);
    font-size: 1.5rem;
    font-weight: 800;
    letter-spacing: -0.02em;
    margin: 0;
    flex: none;
}
.sum-search-wrap {
    position: relative;
    flex: 1;
    min-width: 160px;
    max-width: 320px;
}
.sum-search-wrap input {
    width: 100%;
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: var(--radius-clay);
    box-shadow: var(--clay-shadow-inset);
    padding: 0.5rem 2rem 0.5rem 0.8rem;
    color: var(--text);
    font-size: 0.875rem;
    outline: none;
    box-sizing: border-box;
}
.sum-search-wrap input:focus { border-color: var(--primary); }
.sum-search-clear {
    position: absolute; right: 0.6rem; top: 50%; transform: translateY(-50%);
    background: none; border: none; color: var(--text-dim); cursor: pointer;
    font-size: 1.1rem; line-height: 1; display: none; padding: 0;
}
.sum-gen-wrap {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin-left: auto;
}
.sum-gen-wrap input[type=date] {
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: var(--radius-clay);
    padding: 0.45rem 0.65rem;
    color: var(--text);
    font-size: 0.875rem;
    outline: none;
    color-scheme: dark;
}
.sum-gen-wrap input[type=date]:focus { border-color: var(--primary); }

.sum-layout {
    display: grid;
    grid-template-columns: 320px 1fr;
    gap: 1.25rem;
    align-items: start;
}
@media (max-width: 800px) {
    .sum-layout { grid-template-columns: 1fr; }
    .sum-detail-panel { display: none; }
    .sum-detail-panel.mobile-visible { display: block; }
    .sum-gen-wrap { margin-left: 0; }
    .sum-toolbar { gap: 0.5rem; }
}

/* List */
.sum-list { display: flex; flex-direction: column; gap: 0.5rem; }
.sum-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-clay);
    padding: 0.8rem 1rem;
    cursor: pointer;
    box-shadow: var(--clay-shadow-sm);
    transition: border-color 0.15s, box-shadow 0.15s;
}
.sum-card:hover { border-color: var(--primary); }
.sum-card.active {
    border-color: var(--primary);
    box-shadow: 0 0 0 2px color-mix(in srgb, var(--primary) 20%, transparent);
}
.sum-card-date {
    font-size: 0.75rem;
    font-weight: 700;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 0.3rem;
}
.sum-card-preview {
    font-size: 0.84rem;
    color: var(--text);
    line-height: 1.45;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
}
.sum-card-chips {
    display: flex; flex-wrap: wrap; gap: 0.3rem; margin-top: 0.45rem;
}
.chip {
    font-size: 0.7rem; font-weight: 600;
    padding: 0.18rem 0.5rem; border-radius: 99px;
    background: color-mix(in srgb, var(--primary) 14%, transparent);
    color: var(--primary); white-space: nowrap;
}
.chip.muted {
    background: color-mix(in srgb, var(--text-muted) 10%, transparent);
    color: var(--text-muted);
}
.chip.tag {
    background: color-mix(in srgb, var(--accent, #5BA4E5) 16%, transparent);
    color: var(--accent, #5BA4E5);
}

.sum-empty {
    text-align: center; color: var(--text-muted);
    padding: 2.5rem 1rem; font-size: 0.9rem; line-height: 1.7;
}
.sum-load-more { text-align: center; margin-top: 0.75rem; }

/* Detail panel */
.sum-detail-panel {
    position: sticky;
    top: calc(var(--navbar-height, 56px) + 1rem);
}
.sum-detail-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-clay);
    box-shadow: var(--clay-shadow-sm);
    overflow: hidden;
}
.sum-detail-header {
    padding: 1.1rem 1.4rem 0.75rem;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 0.75rem;
    flex-wrap: wrap;
}
.sum-detail-date-label {
    font-family: var(--font-display);
    font-size: 1rem; font-weight: 800;
    color: var(--text);
}
.sum-detail-body { padding: 1.1rem 1.4rem; }
.sum-detail-text {
    font-size: 0.9rem;
    line-height: 1.75;
    color: var(--text);
    white-space: pre-wrap;
    margin-bottom: 1rem;
}
.sum-detail-chips { display: flex; flex-wrap: wrap; gap: 0.35rem; margin-bottom: 1rem; }
.sum-detail-foot {
    font-size: 0.72rem; color: var(--text-dim);
    display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: 0.5rem;
    border-top: 1px solid var(--border);
    padding: 0.75rem 1.4rem;
}
.sum-detail-actions { display: flex; gap: 0.5rem; flex-wrap: wrap; }
.sum-placeholder {
    text-align: center; color: var(--text-dim);
    padding: 3.5rem 1.5rem; font-size: 0.875rem; line-height: 1.7;
}

/* Generating spinner state */
.sum-generating {
    display: flex; align-items: center; justify-content: center;
    gap: 0.6rem; padding: 2.5rem 1rem; color: var(--text-muted); font-size: 0.875rem;
}
</style>
{% endblock %}

{% block content %}
<div class="container sum-wrap">
    <div class="sum-toolbar">
        <h1>Summaries</h1>

        <div class="sum-search-wrap">
            <input id="sum-search" type="text" placeholder="search…" autocomplete="off">
            <button class="sum-search-clear" id="sum-search-clear" title="Clear">×</button>
        </div>

        <div class="sum-gen-wrap">
            <input type="date" id="sum-gen-date" title="Pick a date to generate a summary">
            <button class="btn btn-primary btn-sm" id="sum-gen-btn" onclick="generateForDate()">Generate</button>
        </div>
    </div>

    <div class="sum-layout">
        <!-- List -->
        <div>
            <div class="sum-list" id="sum-list">
                <div class="sum-empty">loading…</div>
            </div>
            <div class="sum-load-more" id="sum-load-more" style="display:none;">
                <button class="btn btn-outline btn-sm" id="sum-load-more-btn">load more</button>
            </div>
        </div>

        <!-- Detail -->
        <div class="sum-detail-panel" id="sum-detail-panel">
            <div class="sum-detail-card">
                <div class="sum-placeholder" id="sum-placeholder">
                    Select a summary to read it,<br>or pick a date above to generate one.
                </div>
                <div id="sum-detail-content" style="display:none;">
                    <div class="sum-detail-header">
                        <div>
                            <div class="sum-detail-date-label" id="sum-detail-date"></div>
                        </div>
                        <div class="sum-detail-actions">
                            <button class="btn btn-outline btn-sm" id="sum-regen-btn">↻ Regenerate</button>
                            <button class="btn btn-outline btn-sm" id="sum-delete-btn" style="color:var(--danger)">Delete</button>
                        </div>
                    </div>
                    <div class="sum-detail-body">
                        <div class="sum-detail-chips" id="sum-detail-chips"></div>
                        <div class="sum-detail-text" id="sum-detail-text"></div>
                    </div>
                    <div class="sum-detail-foot">
                        <span id="sum-detail-meta"></span>
                    </div>
                </div>
                <div id="sum-generating" class="sum-generating" style="display:none;">
                    <span class="spinner"></span> Generating…
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
const SUMMARIES_URL = '{% url "tracker:summaries_list_api" %}';

let currentPage = 1;
let hasMore = false;
let currentQuery = '';
let activeDate = null;
let searchTimer = null;

// Default date picker to today
document.getElementById('sum-gen-date').value = new Date().toISOString().slice(0, 10);

function fmtDate(iso) {
    const d = new Date(iso + 'T00:00:00');
    return d.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
}
function fmtTs(iso) {
    return new Date(iso).toLocaleString('en-US', { dateStyle: 'medium', timeStyle: 'short' });
}
function escHtml(str) {
    return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function getCsrf() {
    const m = document.cookie.match(/csrftoken=([^;]+)/);
    return m ? m[1] : '';
}

function renderCard(s, prepend) {
    const li = document.createElement('div');
    li.className = 'sum-card';
    li.dataset.date = s.date;

    const chips = (s.places || []).slice(0, 3).map(p =>
        `<span class="chip">${escHtml(p.name || p)}</span>`).join('');
    const tags = (s.tags || []).slice(0, 4).map(t =>
        `<span class="chip tag">#${escHtml(t)}</span>`).join('');
    const dist = s.distance_km != null
        ? `<span class="chip muted">${s.distance_km} km</span>` : '';

    li.innerHTML = `
        <div class="sum-card-date">${fmtDate(s.date)}</div>
        <div class="sum-card-preview">${escHtml(s.summary_preview || '')}</div>
        <div class="sum-card-chips">${chips}${tags}${dist}</div>`;
    li.addEventListener('click', () => selectCard(s.date, li));
    if (prepend) {
        const list = document.getElementById('sum-list');
        list.prepend(li);
    }
    return li;
}

function selectCard(dateStr, cardEl) {
    document.querySelectorAll('.sum-card').forEach(c => c.classList.remove('active'));
    if (cardEl) cardEl.classList.add('active');
    activeDate = dateStr;
    loadDetail(dateStr);
    // on mobile, scroll detail into view
    if (window.innerWidth <= 800) {
        const panel = document.getElementById('sum-detail-panel');
        panel.classList.add('mobile-visible');
        panel.scrollIntoView({ behavior: 'smooth' });
    }
}

function setDetailState(state) {
    document.getElementById('sum-placeholder').style.display   = state === 'placeholder' ? '' : 'none';
    document.getElementById('sum-detail-content').style.display = state === 'content'     ? '' : 'none';
    document.getElementById('sum-generating').style.display    = state === 'generating'   ? '' : 'none';
}

async function loadDetail(dateStr) {
    setDetailState('generating');
    try {
        const r = await fetch(`/api/summaries/${dateStr}/`);
        if (!r.ok) throw new Error('not found');
        showDetail(await r.json());
    } catch {
        setDetailState('placeholder');
        document.getElementById('sum-placeholder').textContent = 'Could not load summary.';
    }
}

function showDetail(s) {
    setDetailState('content');
    document.getElementById('sum-detail-date').textContent = fmtDate(s.date);

    const chips = (s.places || []).map(p =>
        `<span class="chip">${escHtml(p.name || p)}</span>`).join('');
    const tags = (s.tags || []).map(t =>
        `<span class="chip tag">#${escHtml(t)}</span>`).join('');
    const dist = s.distance_km != null
        ? `<span class="chip muted">${s.distance_km} km</span>` : '';
    document.getElementById('sum-detail-chips').innerHTML = chips + tags + dist;

    document.getElementById('sum-detail-text').textContent = s.summary;
    document.getElementById('sum-detail-meta').textContent =
        `Generated ${fmtTs(s.generated_at)} · ${escHtml(s.model_used)}`;

    document.getElementById('sum-regen-btn').onclick = () => generateForDateStr(s.date, true);
    document.getElementById('sum-delete-btn').onclick = () => deleteSummary(s.date);

    activeDate = s.date;
    const card = document.querySelector(`.sum-card[data-date="${s.date}"]`);
    document.querySelectorAll('.sum-card').forEach(c => c.classList.remove('active'));
    if (card) card.classList.add('active');
}

async function generateForDate() {
    const dateStr = document.getElementById('sum-gen-date').value;
    if (!dateStr) { alert('Pick a date first.'); return; }
    await generateForDateStr(dateStr, false);
}

async function generateForDateStr(dateStr, isRegen) {
    setDetailState('generating');
    const btn = isRegen ? document.getElementById('sum-regen-btn') : document.getElementById('sum-gen-btn');
    const origText = btn ? btn.textContent : '';
    if (btn) { btn.disabled = true; btn.textContent = 'Generating…'; }

    try {
        const r = await fetch(`/api/summaries/${dateStr}/generate/`, {
            method: 'POST', headers: { 'X-CSRFToken': getCsrf() }
        });
        const data = await r.json();
        if (!r.ok) {
            setDetailState('placeholder');
            document.getElementById('sum-placeholder').textContent = data.error || 'Generation failed.';
            return;
        }
        showDetail(data);

        // Insert or update the card in the list
        const existing = document.querySelector(`.sum-card[data-date="${dateStr}"]`);
        if (existing) {
            const prev = existing.querySelector('.sum-card-preview');
            if (prev) prev.textContent = (data.summary || '').slice(0, 200);
        } else {
            const card = renderCard({
                date: dateStr,
                summary_preview: (data.summary || '').slice(0, 200),
                places: data.places,
                tags: data.tags,
                distance_km: data.distance_km,
            }, true);
            const list = document.getElementById('sum-list');
            const empty = list.querySelector('.sum-empty');
            if (empty) empty.remove();
            list.prepend(card);
        }
    } catch (e) {
        setDetailState('placeholder');
        document.getElementById('sum-placeholder').textContent = 'Request failed: ' + e.message;
    } finally {
        if (btn) { btn.disabled = false; btn.textContent = origText; }
    }
}

async function deleteSummary(dateStr) {
    if (!confirm('Delete this summary?')) return;
    const r = await fetch(`/api/summaries/${dateStr}/delete/`, {
        method: 'POST', headers: { 'X-CSRFToken': getCsrf() }
    });
    if (!r.ok) { alert('Delete failed.'); return; }
    const card = document.querySelector(`.sum-card[data-date="${dateStr}"]`);
    if (card) card.remove();
    activeDate = null;
    setDetailState('placeholder');
    document.getElementById('sum-placeholder').textContent = 'Select a summary to read it, or pick a date above to generate one.';
    checkEmpty();
}

function checkEmpty() {
    const list = document.getElementById('sum-list');
    if (!list.querySelector('.sum-card'))
        list.innerHTML = '<div class="sum-empty">No summaries yet.<br>Pick a date above and hit Generate, or use Background Jobs in Settings to generate for all past days.</div>';
}

async function loadSummaries(query, page, append) {
    const url = new URL(SUMMARIES_URL, location.origin);
    if (query) url.searchParams.set('q', query);
    url.searchParams.set('page', page);
    url.searchParams.set('per_page', 20);

    const list = document.getElementById('sum-list');
    if (!append) list.innerHTML = '<div class="sum-empty">loading…</div>';

    try {
        const r = await fetch(url);
        const data = await r.json();
        if (!append) list.innerHTML = '';

        if (!data.summaries.length && !append) {
            list.innerHTML = '<div class="sum-empty">No summaries yet.<br>Pick a date above and hit Generate, or use Background Jobs in Settings to generate for all past days.</div>';
        } else {
            data.summaries.forEach(s => list.appendChild(renderCard(s)));
        }
        hasMore = data.has_more;
        document.getElementById('sum-load-more').style.display = hasMore ? '' : 'none';
    } catch {
        list.innerHTML = '<div class="sum-empty">Failed to load summaries.</div>';
    }
}

// Search
const searchInput = document.getElementById('sum-search');
const searchClear = document.getElementById('sum-search-clear');
searchInput.addEventListener('input', () => {
    const q = searchInput.value.trim();
    searchClear.style.display = q ? '' : 'none';
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => {
        currentQuery = q;
        currentPage = 1;
        loadSummaries(currentQuery, 1, false);
    }, 320);
});
searchClear.addEventListener('click', () => {
    searchInput.value = '';
    searchClear.style.display = 'none';
    currentQuery = '';
    currentPage = 1;
    loadSummaries('', 1, false);
});

document.getElementById('sum-load-more-btn').addEventListener('click', () => {
    currentPage++;
    loadSummaries(currentQuery, currentPage, true);
});

loadSummaries('', 1, false);
</script>
{% endblock %}
