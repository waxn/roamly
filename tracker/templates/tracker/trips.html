{% extends "tracker/base.html" %}
{% block title %}Trips - Roamly{% endblock %}

{% block content %}
<div class="container">
    <div class="page-header" style="display: flex; justify-content: space-between; align-items: center;">
        <h1>Trips</h1>
        <button class="btn btn-primary" onclick="showCreateTrip()">New Trip</button>
    </div>

    <!-- Create Trip Form (hidden by default) -->
    <div id="create-trip-form" class="card" style="display: none;">
        <div class="card-header">Create Trip</div>
        <div class="grid grid-2">
            <div class="form-group">
                <label>Trip Name</label>
                <input type="text" id="trip-name" class="form-control" placeholder="e.g., Weekend in Paris">
            </div>
            <div class="form-group">
                <label>Device</label>
                <select id="trip-device" class="form-control">
                    {% for device in devices %}
                    <option value="{{ device.device_id }}">{{ device.name|default:device.device_id }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label>Start Date/Time</label>
                <input type="datetime-local" id="trip-start" class="form-control">
            </div>
            <div class="form-group">
                <label>End Date/Time</label>
                <input type="datetime-local" id="trip-end" class="form-control">
            </div>
        </div>
        <div class="form-group">
            <label>Description</label>
            <textarea id="trip-description" class="form-control" rows="2" placeholder="Optional description..."></textarea>
        </div>
        <div style="display: flex; gap: 0.5rem;">
            <button class="btn btn-primary" onclick="createTrip()">Create</button>
            <button class="btn btn-outline" onclick="hideCreateTrip()">Cancel</button>
        </div>
    </div>

    <!-- Trips List -->
    <div id="trips-list">
        <div style="text-align: center; padding: 2rem; color: var(--text-muted);">
            <span class="spinner"></span> Loading trips...
        </div>
    </div>

    <!-- Trip Detail Modal -->
    <div id="trip-detail" class="card" style="display: none;">
        <div class="card-header" style="display: flex; justify-content: space-between;">
            <span id="trip-detail-name"></span>
            <button class="btn btn-outline btn-sm" onclick="closeTripDetail()">Close</button>
        </div>
        <div id="trip-detail-map" style="height: 400px; border-radius: 8px; margin-bottom: 1rem;"></div>
        <div id="trip-detail-info"></div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
let detailMap = null;

function showCreateTrip() {
    document.getElementById('create-trip-form').style.display = 'block';
}
function hideCreateTrip() {
    document.getElementById('create-trip-form').style.display = 'none';
}

function loadTrips() {
    fetch('/api/trips/')
        .then(r => r.json())
        .then(data => {
            if (data.trips.length === 0) {
                document.getElementById('trips-list').innerHTML =
                    '<div class="card" style="text-align:center;color:var(--text-muted);padding:2rem;">No trips yet. Create one to group your location data.</div>';
                return;
            }
            const html = data.trips.map(trip => {
                const start = new Date(trip.start_time).toLocaleDateString();
                const end = new Date(trip.end_time).toLocaleDateString();
                return `<div class="card" style="cursor:pointer;" onclick="viewTrip(${trip.id})">
                    <div style="display:flex;justify-content:space-between;align-items:center;">
                        <div>
                            <strong>${trip.name}</strong>
                            <div style="font-size:0.8125rem;color:var(--text-muted);margin-top:0.25rem;">
                                ${start} - ${end} &middot; ${trip.device} &middot; ${trip.location_count} points
                            </div>
                            ${trip.description ? `<div style="font-size:0.8125rem;color:var(--text-muted);margin-top:0.25rem;">${trip.description}</div>` : ''}
                        </div>
                        <button class="btn btn-danger btn-sm" onclick="event.stopPropagation();deleteTrip(${trip.id})">Delete</button>
                    </div>
                </div>`;
            }).join('');
            document.getElementById('trips-list').innerHTML = html;
        });
}

function createTrip() {
    const body = {
        name: document.getElementById('trip-name').value,
        device_id: document.getElementById('trip-device').value,
        start_time: document.getElementById('trip-start').value,
        end_time: document.getElementById('trip-end').value,
        description: document.getElementById('trip-description').value,
    };

    fetch('/api/trips/create/', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-CSRFToken': '{{ csrf_token }}' },
        body: JSON.stringify(body)
    })
    .then(r => r.json())
    .then(data => {
        if (data.status === 'ok') {
            hideCreateTrip();
            loadTrips();
        } else {
            alert(data.error || 'Error creating trip');
        }
    });
}

function deleteTrip(id) {
    if (!confirm('Delete this trip?')) return;
    fetch(`/api/trips/${id}/delete/`, {
        method: 'POST',
        headers: { 'X-CSRFToken': '{{ csrf_token }}' }
    })
    .then(() => loadTrips());
}

function viewTrip(id) {
    fetch(`/api/trips/${id}/`)
        .then(r => r.json())
        .then(data => {
            document.getElementById('trip-detail').style.display = 'block';
            document.getElementById('trip-detail-name').textContent = data.name;

            const start = new Date(data.start_time).toLocaleString();
            const end = new Date(data.end_time).toLocaleString();
            document.getElementById('trip-detail-info').innerHTML =
                `<p style="font-size:0.875rem;color:var(--text-muted);">${start} - ${end} &middot; ${data.locations.length} points</p>
                 ${data.description ? `<p style="font-size:0.875rem;">${data.description}</p>` : ''}`;

            // Initialize or update map
            if (detailMap) { detailMap.remove(); }
            detailMap = new maplibregl.Map({
                container: 'trip-detail-map',
                style: {
                    version: 8,
                    sources: { 'osm': { type: 'raster', tiles: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'], tileSize: 256 }},
                    layers: [{ id: 'osm', type: 'raster', source: 'osm' }]
                },
                center: [0, 20], zoom: 2
            });

            detailMap.on('load', () => {
                if (data.locations.length === 0) return;

                const coords = data.locations.map(l => [l.lng, l.lat]);

                detailMap.addSource('trip-line', {
                    type: 'geojson',
                    data: { type: 'Feature', geometry: { type: 'LineString', coordinates: coords }}
                });
                detailMap.addLayer({
                    id: 'trip-line', type: 'line', source: 'trip-line',
                    paint: { 'line-color': '#3b82f6', 'line-width': 3 }
                });

                const features = data.locations.map(l => ({
                    type: 'Feature',
                    geometry: { type: 'Point', coordinates: [l.lng, l.lat] },
                    properties: l
                }));
                detailMap.addSource('trip-points', {
                    type: 'geojson',
                    data: { type: 'FeatureCollection', features }
                });
                detailMap.addLayer({
                    id: 'trip-points', type: 'circle', source: 'trip-points',
                    paint: { 'circle-color': '#3b82f6', 'circle-radius': 4, 'circle-stroke-width': 1, 'circle-stroke-color': '#fff' }
                });

                const lngs = coords.map(c => c[0]);
                const lats = coords.map(c => c[1]);
                detailMap.fitBounds([
                    [Math.min(...lngs), Math.min(...lats)],
                    [Math.max(...lngs), Math.max(...lats)]
                ], { padding: 40 });
            });
        });
}

function closeTripDetail() {
    document.getElementById('trip-detail').style.display = 'none';
    if (detailMap) { detailMap.remove(); detailMap = null; }
}

loadTrips();
</script>
{% endblock %}
