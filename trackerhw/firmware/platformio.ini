; Roamly hardware tracker firmware — Adafruit ESP32-S3 Reverse TFT Feather + NEO-6M.
; Built against Arduino-ESP32 3.x via the pioarduino platform fork (the upstream
; PlatformIO espressif32 platform is frozen on Arduino 2.x).
[env:feather]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = adafruit_feather_esp32s3_reversetft
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.filesystem = littlefs
board_build.partitions = partitions.csv
; USB-Serial-JTAG (HWCDC) rather than TinyUSB: esptool resets it natively (no
; 1200-baud touch / double-tap), and HWCDC::isPlugged() tells us a USB host is
; attached, which is when the firmware must not light-sleep.
board_upload.use_1200bps_touch = no
board_upload.wait_for_upload_port = no
; ARDUINO_USB_CDC_ON_BOOT=1 already comes from the board definition. Don't
; unflag and re-add it: build_unflags strips it from the framework build too,
; and a core compiled without it disagrees with the sketch about what `Serial` is.
build_flags =
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=1
lib_deps =
    adafruit/Adafruit GFX Library
    adafruit/Adafruit ST7735 and ST7789 Library
    adafruit/Adafruit MAX1704X
    adafruit/Adafruit LC709203F
    mikalhart/TinyGPSPlus
    bblanchon/ArduinoJson@^7
